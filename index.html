<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"/>
<meta name="theme-color" content="#061016"/>
<title>Coastal Grade · PVR</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<style>
:root{
  --bg:#061016;
  --bg-deep:#03080c;
  --map-bg:#08141c;
  --sticky:#08181f;
  --toast:#12303a;
  --foam:#e7fbf6;
  --dim:#9bbfb8;
  --muted:#6f8f94;
  --line:rgba(180,230,220,.12);
  --sheet:rgba(8,18,24,.94);
  --accent:#3eebc9;
  --accent-ink:#052019;
  --accent-d:rgba(62,235,201,.16);
  --warn:#e6c878;
  --warn-d:rgba(230,200,120,.16);
  --danger:#ff7a6a;
  --info:#7ab3ff;
  --uc:#ffb020;
  --rumor:#c9a0ff;
  --unk:#4a6a72;
  --label:#cfeae4;
  --danger-soft:#ffd0c8;
  --dispute:#ffd8a0;
  --radar-ink:#9ec9c8;
  --radar-grid:rgba(90,180,190,.18);
  --vignette:rgba(6,16,22,.55);
  --vignette-end:rgba(6,16,22,.25);
  --accent-06:rgba(62,235,201,.06);
  --accent-08:rgba(62,235,201,.08);
  --accent-1:rgba(62,235,201,.1);
  --accent-22:rgba(62,235,201,.22);
  --accent-28:rgba(62,235,201,.28);
  --accent-3:rgba(62,235,201,.3);
  --accent-35:rgba(62,235,201,.35);
  --accent-55:rgba(62,235,201,.55);
  --accent-7:rgba(62,235,201,.7);
  --accent-9:rgba(62,235,201,.9);
  --warn-08:rgba(230,200,120,.08);
  --warn-12:rgba(230,200,120,.12);
  --warn-18:rgba(230,200,120,.18);
  --warn-25:rgba(230,200,120,.25);
  --warn-28:rgba(230,200,120,.28);
  --warn-3:rgba(230,200,120,.3);
  --warn-45:rgba(230,200,120,.45);
  --warn-95:rgba(230,200,120,.95);
  --danger-08:rgba(255,122,106,.08);
  --danger-22:rgba(255,122,106,.22);
  --uc-12:rgba(255,176,32,.12);
  --uc-14:rgba(255,176,32,.14);
  --uc-3:rgba(255,176,32,.3);
  --uc-4:rgba(255,176,32,.4);
  --info-12:rgba(122,179,255,.12);
  --info-3:rgba(122,179,255,.3);
  --rumor-12:rgba(201,160,255,.12);
  --rumor-3:rgba(201,160,255,.3);
  --unk-ring:rgba(150,180,180,.25);
  --unk-glow:rgba(80,110,120,.3);
  --foam-16:rgba(231,251,246,.16);
  --sheet-72:rgba(8,18,24,.72);
  --sheet-78:rgba(8,18,24,.78);
  --sheet-9:rgba(8,18,24,.9);
  --sheet-92:rgba(8,18,24,.92);
  --overlay:rgba(3,8,12,.58);
  --overlay-soft:rgba(3,8,12,.55);
  --white-03:rgba(255,255,255,.03);
  --white-04:rgba(255,255,255,.04);
  --white-05:rgba(255,255,255,.05);
  --white-06:rgba(255,255,255,.06);
  --white-18:rgba(255,255,255,.18);
  --shadow:rgba(0,0,0,.45);
  --mint:var(--accent);
  --mint-d:var(--accent-d);
  --sand:var(--warn);
  --sand-d:var(--warn-d);
  --storm:var(--danger);
  --tender:var(--info);
  --font-display:Syne,sans-serif;
  --font-body:"DM Sans",system-ui,sans-serif;
  --radius-sheet:22px;
  --radius-chip:999px;
  --radius-card:16px;
  --space-1:4px;
  --space-2:6px;
  --space-3:8px;
  --space-4:10px;
  --space-5:12px;
  --space-6:14px;
  --space-7:16px;
  --sb:env(safe-area-inset-bottom,0px);
  --st:env(safe-area-inset-top,0px);
  --sl:env(safe-area-inset-left,0px);
  --sr:env(safe-area-inset-right,0px);
  --dock-h:88px;
  --rail-w:400px
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100dvh;width:100%;margin:0;background:var(--bg-deep);color:var(--foam);font-family:var(--font-body);overflow:hidden;overscroll-behavior:none}
#app{height:100dvh;width:100%;position:relative;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
#stage{position:absolute;inset:0;overflow:hidden}
#map{position:absolute;inset:0;background:var(--map-bg)}
.leaflet-container{background:var(--map-bg);font-family:inherit}
.leaflet-control-attribution{display:none!important}
.leaflet-attribution-flag,.leaflet-control-attribution svg,.leaflet-control-attribution img{display:none!important}
.leaflet-control-zoom{display:none}
.vignette{pointer-events:none;position:absolute;inset:0;z-index:400;background:radial-gradient(120% 70% at 50% 100%,var(--vignette),transparent 55%),linear-gradient(180deg,var(--vignette) 0%,transparent 18%,transparent 70%,var(--vignette-end) 100%)}
.topbar{position:absolute;top:0;left:0;right:0;z-index:800;padding:calc(10px + var(--st)) 14px 0 calc(14px + var(--sl));display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.brand h1{font-family:var(--font-display);font-weight:800;letter-spacing:.04em;font-size:15px;margin:0;line-height:1.1}
.brand .sub{font-size:10.5px;color:var(--dim);letter-spacing:.04em;margin-top:2px}
.top-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.seed-chip,.list-btn,.qa-chip{font-size:10px;border-radius:var(--radius-chip);padding:6px 9px;white-space:nowrap;border:1px solid var(--warn-25);display:inline-flex;align-items:center;justify-content:center}
.seed-chip{color:var(--sand);background:var(--sand-d)}
.qa-chip{color:var(--mint);background:var(--mint-d);border-color:var(--accent-3)}
.qa-chip[hidden]{display:none!important}
.list-btn{color:var(--foam);background:var(--sheet-78);border-color:var(--line);cursor:pointer;font:600 12px/1 var(--font-body);min-height:44px;min-width:44px}
.drive{position:absolute;top:calc(58px + var(--st));left:calc(12px + var(--sl));right:calc(12px + var(--sr));z-index:800;display:flex;gap:6px;padding:4px;background:var(--sheet-78);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px)}
.drive button{flex:1;border:0;background:transparent;color:var(--dim);font:600 12px/1 var(--font-body);padding:9px 0;border-radius:11px;cursor:pointer;min-height:44px}
.drive button.on{background:var(--mint-d);color:var(--mint)}
.drive-label{position:absolute;top:calc(102px + var(--st));left:calc(16px + var(--sl));z-index:800;font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.count-pill{position:absolute;top:calc(100px + var(--st));right:calc(14px + var(--sr));z-index:800;font-size:11px;color:var(--foam);background:var(--sheet-78);border:1px solid var(--line);border-radius:var(--radius-chip);padding:5px 9px}

.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--accent-35),0 0 12px var(--accent-35);background:var(--mint);transform:translate(-7px,-7px)}
.dot.unknown{background:var(--unk);box-shadow:0 0 0 1px var(--unk-ring),0 0 8px var(--unk-glow)}
.dot.primary{background:var(--sand);width:16px;height:16px;transform:translate(-8px,-8px);box-shadow:0 0 0 1px var(--warn-45),0 0 14px var(--warn-45)}
.dot.locked{opacity:.72}
.dot.sel{box-shadow:0 0 0 3px var(--accent-55),0 0 18px var(--accent-7)}
.dot.boat{border-radius:4px}
.airport{width:22px;height:22px;transform:translate(-11px,-11px);border-radius:6px;background:var(--toast);border:1px solid var(--mint);display:grid;place-items:center;color:var(--mint);font-size:10px;font-weight:700;box-shadow:0 0 16px var(--accent-35)}
.lbl{background:none;border:0;box-shadow:none;font-size:10px;font-weight:600;color:var(--label);text-shadow:0 1px 4px var(--bg),0 0 8px var(--bg);margin-left:8px;margin-top:-2px;white-space:nowrap;pointer-events:none}

#rail{position:absolute;inset:0;z-index:900;pointer-events:none;display:flex;flex-direction:column;justify-content:flex-end}
.compare-dock{position:absolute;left:calc(10px + var(--sl));right:calc(10px + var(--sr));bottom:calc(12px + var(--sb));z-index:960;background:var(--sheet-9);border:1px solid var(--line);border-radius:var(--radius-card);padding:10px 12px;backdrop-filter:blur(12px);display:flex;align-items:flex-start;gap:8px;pointer-events:auto;flex-wrap:nowrap}
.dock-chips{flex:1 1 0;display:flex;flex-wrap:wrap;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;-webkit-overflow-scrolling:touch}
.dock-chips::-webkit-scrollbar{display:none;width:0;height:0}
.dock-chip,.dock-empty{flex-shrink:0;min-height:44px;min-width:44px;border-radius:12px;padding:6px 10px;display:flex;align-items:center;gap:6px;font-size:11px;border:1px solid var(--line);background:var(--white-04);color:var(--foam);white-space:nowrap}
.dock-chip button{border:0;background:transparent;color:var(--dim);cursor:pointer;min-width:32px;min-height:32px;font-size:14px}
.dock-empty{color:var(--muted);border-style:dashed}
.dock-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.go-compare,.clear-compare{border:0;cursor:pointer;font:600 11px/1 var(--font-body);border-radius:var(--radius-chip);padding:10px 11px;white-space:nowrap;flex-shrink:0;min-height:44px;min-width:44px}
.go-compare{background:var(--mint);color:var(--accent-ink)}
.go-compare:disabled{opacity:.35;cursor:default}
.clear-compare{background:transparent;color:var(--dim);padding:10px 6px}

.sheet{position:absolute;left:0;right:0;bottom:0;z-index:900;background:var(--sheet);border-top:1px solid var(--line);border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;backdrop-filter:blur(16px);transform:translateY(110%);transition:transform .32s cubic-bezier(.2,.8,.2,1),height .32s cubic-bezier(.2,.8,.2,1);height:64dvh;display:flex;flex-direction:column;box-shadow:0 -20px 60px var(--shadow);pointer-events:auto}
.sheet.open{transform:translateY(0)}
.sheet.snap-full{height:calc(100dvh - var(--st))}
.sheet.dragging{transition:none}
.handle-hit{display:flex;align-items:center;justify-content:center;height:44px;min-height:44px;width:100%;flex-shrink:0;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.handle{width:42px;height:4px;border-radius:4px;background:var(--white-18);pointer-events:none}
.sheet-scroll{overflow:auto;padding:0 16px calc(var(--dock-h) + 24px + var(--sb));flex:1;min-height:0;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior:contain}
.sheet.snap-full .sheet-scroll{padding-bottom:calc(24px + var(--sb))}
.compare-dock.tucked{transform:translateY(calc(100% + 32px));pointer-events:none;z-index:800}
.sheet-scroll::-webkit-scrollbar{width:0;height:0;display:none}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.sheet-head h2{margin:0;font-family:var(--font-display);font-size:22px;letter-spacing:-.02em}
.meta{font-size:12px;color:var(--dim);margin-top:3px}
.x,.icon-btn{border:0;background:var(--white-06);color:var(--foam);width:44px;height:44px;border-radius:10px;cursor:pointer;font-size:16px;flex-shrink:0}
.price-card{background:linear-gradient(180deg,var(--accent-08),var(--white-03));border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:12px}
.price-card .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.price-card .v{font-size:26px;font-weight:700;letter-spacing:-.03em;margin-top:2px}
.price-card .v.unk{color:var(--muted);font-style:italic;font-weight:500;font-size:22px}
.rows{margin-top:8px;display:grid;gap:4px}
.rows div{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);gap:8px}
.rows b{color:var(--foam);font-weight:600;text-align:right}
.hurr{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--danger-08);border:1px solid var(--danger-22);font-size:12px;margin-bottom:10px;color:var(--danger-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{font-size:10.5px;font-weight:600;letter-spacing:.03em;border-radius:var(--radius-chip);padding:5px 9px;border:1px solid transparent}
.chip.open{background:var(--mint-d);color:var(--mint);border-color:var(--accent-3)}
.chip.uc{background:var(--uc-12);color:var(--uc);border-color:var(--uc-3)}
.chip.complete{background:var(--warn-12);color:var(--sand);border-color:var(--warn-3)}
.chip.tender{background:var(--info-12);color:var(--tender);border-color:var(--info-3)}
.chip.rumor{background:var(--rumor-12);color:var(--rumor);border-color:var(--rumor-3)}
.chip.dispute{background:var(--uc-14);color:var(--uc);border-color:var(--uc-4)}
.chip.none{color:var(--muted);background:var(--white-03);border-color:var(--line);font-weight:500;letter-spacing:0}
.chip.primary{background:var(--sand-d);color:var(--sand);border-color:var(--warn-3)}
.chip.priced{background:var(--mint-d);color:var(--mint);border-color:var(--accent-3)}
.chip.unknown{background:var(--white-04);color:var(--muted);border-color:var(--line)}
.chip.lock{background:var(--white-04);color:var(--dim);border-color:var(--line)}
.caption{font-size:10.5px;color:var(--muted);margin:0 0 12px;line-height:1.4}
.actions{display:flex;gap:8px;margin-bottom:6px}
.actions button,.back-btn{flex:1;border:0;border-radius:12px;padding:11px;cursor:pointer;font:600 13px/1 var(--font-body);min-height:44px;min-width:44px}
.btn-a{background:var(--mint-d);color:var(--mint)}
.btn-ghost{background:var(--white-05);color:var(--dim)}
.legend{display:flex;flex-wrap:wrap;gap:8px 10px;margin:8px 0 12px;font-size:10px;color:var(--muted)}
.legend i{display:inline-block;width:7px;height:7px;border-radius:99px;margin-right:4px}
.map-credit{position:absolute;right:calc(12px + var(--sr));bottom:calc(var(--dock-h) + 16px + var(--sb));z-index:500;display:flex;align-items:center;height:16px;min-width:16px;min-height:16px;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--sheet-72);color:var(--muted);font:600 9px/16px var(--font-body);cursor:pointer}
.map-credit-i{width:16px;height:16px;display:grid;place-items:center;flex-shrink:0;font-style:italic;font-weight:700}
.map-credit-text{max-width:0;overflow:hidden;white-space:nowrap;opacity:0;padding-right:0;transition:max-width .2s ease,opacity .2s ease,padding .2s ease}
.map-credit.open .map-credit-text{max-width:88px;opacity:1;padding-right:7px}

.filters{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter-chip,.sort-chip{border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:var(--radius-chip);padding:10px 12px;font:600 11px/1 var(--font-body);cursor:pointer;min-height:44px;white-space:nowrap}
.filter-chip.on{background:var(--mint-d);color:var(--mint);border-color:var(--accent-3)}
.sort-chip.on{background:var(--sand-d);color:var(--sand);border-color:var(--warn-3)}
.sort-row{display:flex;gap:6px;margin-bottom:12px}

.rank-line{display:flex;align-items:stretch;gap:4px;border-bottom:1px solid var(--line)}
.rank-line .icon-btn{align-self:center;flex-shrink:0}
.rank-row{display:grid;grid-template-columns:28px 1fr auto;gap:8px 10px;align-items:center;padding:10px 4px;border-bottom:0;min-height:52px;cursor:pointer;width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-top:0;color:inherit;font:inherit}
.rank-num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;font-weight:600}
.rank-name{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rank-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:11px;color:var(--dim);grid-column:2 / -1}
.rank-usd{font-variant-numeric:tabular-nums;font-weight:700;color:var(--foam);font-size:13px}
.rank-usd.unk{color:var(--muted);font-style:italic;font-weight:500}
.vs{font-variant-numeric:tabular-nums}
.vs.pos{color:var(--mint)}
.vs.neg{color:var(--sand)}
.score-col{color:var(--muted);font-variant-numeric:tabular-nums}
.group-h{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.lock-ico{font-size:10px;color:var(--dim)}

.cmp-wrap{overflow-x:auto;margin:0 -4px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cmp-wrap::-webkit-scrollbar{display:none;width:0;height:0}
.cmp-table{border-collapse:separate;border-spacing:0;font-size:12.5px;width:100%;table-layout:fixed}
.cmp-many .cmp-table{table-layout:auto;width:max-content;min-width:100%}
.cmp-table th,.cmp-table td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.cmp-table thead th:not(:first-child),.cmp-table td:not(:first-child){max-width:148px}
.cmp-many .cmp-table thead th:not(:first-child),.cmp-many .cmp-table td:not(:first-child){min-width:120px}
.cmp-table th:first-child,.cmp-table td:first-child{position:sticky;left:0;z-index:1;background:var(--sticky);color:var(--muted);font-weight:600;min-width:132px}
.cmp-table thead th{color:var(--foam);text-align:left}
.cmp-table thead th:first-child{color:var(--muted)}
.metric-lab{appearance:none;-webkit-appearance:none;background:transparent;border:0;color:inherit;font:inherit;font-weight:600;text-align:left;min-height:44px;min-width:44px;padding:0;width:100%;cursor:pointer}
.cmp-table td[data-metric]{cursor:pointer}
.facts{display:grid;gap:8px;margin:8px 0 12px}
.facts-row{display:grid;grid-template-columns:88px 1fr;gap:8px;font-size:12px}
.facts-row .k{color:var(--muted)}
.facts-grid{display:grid;gap:8px;overflow-x:auto;scrollbar-width:none}
.facts-grid::-webkit-scrollbar{display:none}
.fact-col{background:var(--white-03);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:140px}
.fact-col h3{margin:0 0 8px;font-size:13px}
.fact-col div{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--dim);padding:4px 0;border-bottom:1px solid var(--line)}
.fact-col div:last-child{border-bottom:0}
.fact-col b{color:var(--foam);font-weight:600;text-align:right}

.modal{position:fixed;inset:0;z-index:1100;background:var(--overlay);display:grid;place-items:center;padding:24px 24px calc(var(--dock-h) + 24px + var(--sb));pointer-events:auto}
.modal[hidden]{display:none}
.modal-card{width:min(380px,100%);background:var(--sheet);border:1px solid var(--line);border-radius:var(--radius-card);padding:20px;box-shadow:0 20px 60px var(--shadow)}
.modal-card h2{font-family:var(--font-display);margin:0 0 8px;font-size:22px}
.price-pair{display:flex;gap:8px;margin:14px 0}
.price-pair span{flex:1;background:var(--mint-d);color:var(--mint);border-radius:10px;padding:12px 8px;text-align:center;font-weight:700;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(var(--dock-h) + 20px + var(--sb));transform:translateX(-50%);z-index:1200;background:var(--toast);border:1px solid var(--sand);color:var(--sand);padding:12px 16px;border-radius:12px;font-size:13px;font-weight:600;min-height:44px;display:flex;align-items:center;pointer-events:none;white-space:nowrap}
.toast[hidden]{display:none}


.spider-block{margin:0 0 16px}
.spider-empty{font-size:12px;color:var(--muted);margin:0 0 14px;font-style:italic}
.chart-wrap{height:250px;position:relative;margin:4px 0 8px;width:100%}
.chart-wrap canvas{display:block;width:100%;height:100%}
.radar-hits{position:absolute;inset:0;pointer-events:none}
.radar-hit{position:absolute;width:44px;height:44px;min-width:44px;min-height:44px;border:0;background:transparent;padding:0;margin:0;cursor:pointer;pointer-events:auto;transform:translate(-50%,-50%);appearance:none;-webkit-appearance:none;visibility:hidden}
#openSettings{padding:0;width:44px;height:44px;min-width:44px;min-height:44px}
#openSettings svg{display:block;width:18px;height:18px}
.chip.partial{background:var(--sand-d);color:var(--sand);border-color:var(--warn-3);font-weight:600}
.partial-head{display:flex;align-items:center;gap:10px;margin:0 0 10px}

.define-layer{position:absolute;left:0;right:0;top:0;bottom:calc(var(--dock-h) + 8px);z-index:940;display:grid;place-items:center;padding:16px 14px 12px;background:var(--overlay-soft);overflow:auto;pointer-events:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

}

<script>
(function () {
  const BRAND = { name: "Coastal Grade", short: "COASTAL GRADE", title: "Coastal Grade \u00b7 PVR" };
  const PLAN_KEY = "coastalgrade.view";
  const FREE = ["bucerias", "nuevo-vallarta", "sayulita", "punta-mita", "conchas-chinas"];
  const SHORT = {
    "pv-5dedic": "5 de Dic",
    "boca": "Boca",
    "la-cruz": "La Cruz",
    "cabo-medano": "Cabo Médano"
  };
  const STAGE_CHIP = {
    open: "open",
    complete_not_open: "complete",
    under_construction: "uc",
    rumor: "rumor",
    tender: "tender"
  };
  const STAGE_LABEL = {
    open: "OPEN / priced-in",
    complete_not_open: "COMPLETE / NOT OPEN",
    under_construction: "UNDER CONSTRUCTION",
    rumor: "RUMOR",
    tender: "TENDER"
  };

  const preview = new URLSearchParams(location.search).get("preview") === "1"
    || localStorage.getItem("cg_owner_preview") === "1";

  function readStoredPlan() {
    try {
      const v = localStorage.getItem(PLAN_KEY);
      if (v === "light" || v === "pro") return v;
    } catch (e) {}
    return "pro";
  }

  const state = {
    minutes: 90,
    selected: null,
    compare: [],
    view: "map",
    plan: readStoredPlan(),
    listFilter: "all",
    listSort: "price",
    comingFilter: "all",
    proId: null
  };

  let DATASET = null;
  let TOWNS = [];
  let CABO = null;
  let CC = null;
  let CATALOG = {};
  let HURR_REGION = null;
  let PIPELINE = [];
  let SCORES = {};
  let SCORES_META = null;
  let markers = {};
  let map, radius;

  document.title = BRAND.title;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }

  function isDesktop() {
    return window.matchMedia("(min-width: 900px)").matches;
  }

  function getPlan() {
    if (preview) return "pro";
    return state.plan === "light" ? "light" : "pro";
  }

  function setPlan(plan) {
    const next = plan === "light" ? "light" : "pro";
    state.plan = next;
    try { localStorage.setItem(PLAN_KEY, next); } catch (e) {}
    if (next === "light") {
      state.compare = state.compare.filter(function (id) { return unlocked(id); });
      if (state.selected && !unlocked(state.selected)) {
        openView("map");
      }
    }
    refreshMarkers();
    paintDock();
    const sheet = document.getElementById("sheet");
    if (sheet && sheet.classList.contains("open")) paintSheet();
    updateSettingsChips();
  }

  function unlocked(id) {
    if (preview || getPlan() === "pro") return !!town(id);
    return FREE.indexOf(id) !== -1;
  }

  function updateSettingsChips() {
    const modal = document.getElementById("modal");
    if (!modal || modal.hidden) return;
    const plan = getPlan();
    modal.querySelectorAll("[data-plan]").forEach(function (b) {
      b.classList.toggle("on", b.getAttribute("data-plan") === plan);
    });
  }

  function bindSettingsChips() {
    const modal = document.getElementById("modal");
    if (!modal) return;
    modal.querySelectorAll("[data-plan]").forEach(function (b) {
      b.onclick = function () { setPlan(b.getAttribute("data-plan")); };
    });
  }

  function brandColor(token) {
    return getComputedStyle(document.documentElement).getPropertyValue(token).trim();
  }

  function scoreRow(t) {
    return t && SCORES[t.id] ? SCORES[t.id] : null;
  }

  function scoreOf(t) {
    const row = scoreRow(t);
    if (!row || !row.composite || row.composite.overall == null) return null;
    return row.composite.overall;
  }

  function axisScore(row, key) {
    const a = row && row.axes && row.axes[key];
    if (!a || a.status === "unknown" || a.score == null) return null;
    return a.score;
  }

  function shortName(t) {
    return SHORT[t.id] || t.name;
  }

  function headlineOf(t) {
    if (t && t.usd_m2 && t.usd_m2.headline != null) return t.usd_m2.headline;
    return null;
  }

  function tierOf(t) {
    const h = headlineOf(t);
    if (h != null && (t.peer || t.off_map)) return "primary";
    if (h != null) return "priced";
    return "unknown";
  }

  function fmtUsd(n) {
    if (n == null) return "unknown";
    return "$" + Math.round(n).toLocaleString("en-US");
  }

  function vsFmt(a, b) {
    if (a == null || b == null) return { text: "—", cls: "" };
    const d = Math.round(a - b);
    if (d === 0) return { text: "0", cls: "" };
    const pct = Math.round((d / b) * 100);
    const sign = d > 0 ? "+" : "\u2212";
    return {
      text: sign + "$" + Math.abs(d).toLocaleString("en-US") + " · " + sign + Math.abs(pct) + "%",
      cls: d > 0 ? "pos" : "neg"
    };
  }

  function driveLabel(t) {
    const d = t.drive_min_to_pvr || {};
    if (t.off_map || d.basis === "off_map") return d.label || "off-map";
    if (d.basis === "boat" || t.access === "boat") return d.label || "BOAT";
    if (d.basis === "in_pv" || t.access === "in_pv") return d.label || "in PV";
    if (d.low == null && d.high == null) return "unknown";
    if (d.low === d.high) return "~" + d.low + " min est.";
    return "~" + d.low + "\u2013" + d.high + " min est.";
  }

  function driveKey(t) {
    const d = t.drive_min_to_pvr || {};
    if (d.basis === "in_pv" || t.access === "in_pv") return 0;
    if (d.basis === "boat" || t.access === "boat") return 1000;
    if (t.off_map || d.basis === "off_map") return 2000;
    if (d.low == null) return 900;
    return d.low;
  }

  function typicalMin(t) {
    const d = t.drive_min_to_pvr || {};
    if (d.basis === "boat" || t.access === "boat") return 70;
    if (d.basis === "in_pv" || t.access === "in_pv") return 12;
    if (d.low == null) return 90;
    if (d.high == null) return d.low;
    return Math.round((d.low + d.high) / 2);
  }

  function inRadius(t) {
    if (t.off_map) return false;
    const d = t.drive_min_to_pvr || {};
    if (d.basis === "boat" || t.access === "boat") return state.minutes >= 60;
    if (d.basis === "in_pv" || t.access === "in_pv") return true;
    if (d.low == null) return true;
    if (state.minutes >= 120) return d.low <= 150;
    return d.low <= state.minutes;
  }

  function town(id) {
    if (CABO && CABO.id === id) return CABO;
    return TOWNS.find(function (t) { return t.id === id; });
  }

  function allPlaces() {
    return CABO ? TOWNS.concat([CABO]) : TOWNS.slice();
  }

  function catalystObjs(t) {
    return (t.catalysts || []).map(function (id) {
      const c = CATALOG[id];
      if (!c) return { id: id, label: id, stage: "none", priced_in: false, meta: "" };
      return { id: id, label: c.label, stage: c.stage, priced_in: !!c.priced_in, meta: c.meta || "" };
    });
  }

  function chipHtml(c) {
    const klass = STAGE_CHIP[c.stage] || "none";
    return '<span class="chip ' + klass + '">' + esc(c.label) + (c.meta ? " · " + esc(c.meta) : "") + "</span>";
  }


  const AXES = {
    access: {
      name: "ACCESS",
      mean: "Drive time to PVR.",
      grade: [
        "Gate is about 2 hours of an international airport.",
        "Shorter drive scores higher.",
        "Times in the file are estimates."
      ]
    },
    signal: {
      name: "SIGNAL",
      mean: "Do we have a verified asking USD/m\u00b2 (Homia MLS / Inmuebles24).",
      grade: [
        "This is data quality, not a vibe score.",
        "No headline price = no score."
      ]
    },
    storm: {
      name: "STORM",
      mean: "Hurricane history and damage, not a hurricane-free badge.",
      grade: [
        "The 46-storm NOAA count is PV-centered (60 nmi) and is not stamped on every town.",
        "Town note only when one exists (e.g. Lidia / Tomatl\u00e1n)."
      ]
    },
    catalyst: {
      name: "CATALYST",
      mean: "Future upside only.",
      grade: [
        "Stages: rumor \u2192 tender \u2192 under construction \u2192 complete-not-open \u2192 open.",
        "Open is priced-in and does not count as future upside."
      ]
    },
    comps: {
      name: "COMPS",
      mean: "Price runway vs peers: Puerto Vallarta, Sayulita, Punta Mita, Cabo M\u00e9dano.",
      grade: [
        "How cheap or expensive this town is per m\u00b2 versus those markets.",
        "No verified USD/m\u00b2 = no Comps score.",
        "AMPI averages are not comps."
      ]
    },
    beach: {
      name: "BEACH",
      mean: "Beach quality and sargassum.",
      grade: [
        "Pacific is usually lighter on sargassum than the Caribbean; still grade the beach, never a free badge."
      ]
    }
  };

  const METRICS = {
    usd: {
      name: "Asking USD/m\u00b2",
      mean: "What sellers are asking per square meter of built space, in US dollars, right now. Not a sold price.",
      grade: [
        "This is what sellers are asking per square meter of built space, in US dollars, right now.",
        "It is not a sold price. Unknown stays unknown."
      ]
    },
    source: {
      name: "Source",
      mean: "Which listing feed the number came from. Homia MLS is the tourist-condo feed we trust for Aug 2026.",
      grade: [
        "Source names the listing feed the number came from.",
        "Homia MLS is the tourist-condo feed we trust for Aug 2026."
      ]
    },
    n: {
      name: "n",
      mean: "How many listings went into that number. Sayulita n=53 means 53 listings, not 53 towns. Bigger n is more trustworthy. No n = we only have a headline, not a sample.",
      grade: [
        "n is how many listings went into the number — not how many towns.",
        "Bigger n is more trustworthy. No n means we only have a headline, not a sample."
      ]
    },
    drive: {
      name: "Drive to PVR",
      mean: "Estimated minutes to Puerto Vallarta airport. Not a live GPS drive.",
      grade: [
        "These are estimated minutes to Puerto Vallarta airport.",
        "Not a live GPS drive."
      ]
    },
    catalysts: {
      name: "Catalysts",
      mean: "A road, hotel, or bridge that can move prices. Open is already priced in and is not future upside.",
      grade: [
        "A catalyst is a road, hotel, or bridge that can move prices.",
        "Open is already priced in and is not future upside."
      ]
    },
    vscc: {
      name: "vs Conchas Chinas",
      mean: "Cheaper or more expensive than Conchas Chinas (the expensive PV beach peer). Negative % means cheaper.",
      grade: [
        "Cheaper or more expensive than Conchas Chinas, the expensive PV beach peer.",
        "A negative percent means cheaper."
      ]
    },
    score: {
      name: "Score",
      mean: "This is a PARTIAL grade. 55/100 weight unknown (hurricane, safety, water, beach). Composite renormalized on catalysts + runway + timezone only. Do not invent a single complete score.",
      grade: [
        "v1 composite is partial: hurricane, safety, potable water, and beach/sargassum are unknown for every priced town (55 of 100 weight dropped). Do not present overall as a complete Coastal Grade.",
        "Weights used: 45 (future catalysts, price runway vs peers, timezone overlap). Weights dropped: 55.",
        "Never present this number as a complete Coastal Grade."
      ]
    }
  };

  function catalystDate(meta) {
    if (!meta) return null;
    const s = String(meta);
    const seasonal = s.match(/\b((?:early|mid|late|winter|spring|summer|fall|autumn)\s+20\d{2})\b/i);
    if (seasonal) return seasonal[1];
    const dmy = s.match(/\b(\d{1,2}\/\d{1,2}\/\d{2,4})\b/);
    if (dmy) return dmy[1];
    const rangeMon = s.match(/\b(\d{1,2}[\u2013\-]\d{1,2}\s+(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\.?\s+20\d{2})\b/i);
    if (rangeMon) return rangeMon[1];
    const mon = s.match(/\b((?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\.?\s+20\d{2})\b/i);
    if (mon) return mon[1];
    return null;
  }

  function thisAccess(t) {
    const d = t.drive_min_to_pvr || {};
    if (d.basis === "boat" || t.access === "boat") return (d.label || "BOAT") + " \u00b7 boat";
    if (d.basis === "in_pv" || t.access === "in_pv") return (d.label || "in PV") + " \u00b7 in PV";
    if (d.basis === "off_map" || t.access === "off_map") return "off-map";
    if (d.low == null && d.high == null) return "unknown \u2014 not invented";
    return driveLabel(t) + " \u00b7 " + (d.basis || "estimated");
  }

  function thisSignal(t) {
    const u = t.usd_m2;
    if (!u || u.headline == null) return "unknown \u2014 not invented";
    let s = fmtUsd(u.headline);
    if (u.source) s += " \u00b7 " + u.source;
    if (u.n != null) s += " \u00b7 n=" + u.n;
    return s;
  }

  function thisStorm(t) {
    if (t.hurricane && t.hurricane.note) return t.hurricane.note;
    return "unknown \u2014 not invented";
  }

  function thisCatalyst(t) {
    const cats = catalystObjs(t);
    if (!cats.length) return "Nothing new on file.";
    const bits = cats.map(function (c) {
      return c.label + " \u00b7 " + (STAGE_LABEL[c.stage] || c.stage);
    });
    const future = cats.filter(function (c) {
      return c.stage !== "open" && !c.priced_in;
    });
    if (!future.length) {
      return bits.join(". ") + " Open is priced-in and does not count as future upside.";
    }
    return bits.join(". ");
  }

  function thisComps(t) {
    const h = headlineOf(t);
    if (h == null) return "unknown \u2014 not invented";
    const vscc = vsFmt(h, headlineOf(CC));
    const vscb = vsFmt(h, headlineOf(CABO));
    return "vs Conchas Chinas " + vscc.text + ". vs Cabo M\u00e9dano " + vscb.text + ".";
  }

  function thisBeach(t) {
    const band = t.usd_m2 && t.usd_m2.band;
    if (band && /beach|lower/i.test(String(band))) return String(band);
    return "unknown \u2014 not invented";
  }

  function thisTownLine(id, t) {
    if (!t) return "";
    if (id === "access" || id === "drive") return thisAccess(t);
    if (id === "signal") return thisSignal(t);
    if (id === "storm") return thisStorm(t);
    if (id === "catalyst" || id === "catalysts") return thisCatalyst(t);
    if (id === "comps" || id === "vscc") return thisComps(t);
    if (id === "beach") return thisBeach(t);
    if (id === "usd") {
      const h = headlineOf(t);
      return h == null ? "unknown \u2014 not invented" : fmtUsd(h);
    }
    if (id === "source") {
      if (t.usd_m2 && t.usd_m2.source) return t.usd_m2.source;
      return "unknown \u2014 not invented";
    }
    if (id === "n") {
      if (t.usd_m2 && t.usd_m2.n != null) return String(t.usd_m2.n);
      return "\u2014";
    }
    if (id === "score") {
      const row = scoreRow(t);
      if (!row || !row.composite || row.composite.overall == null) return "\u2014";
      return String(row.composite.overall) + " \u00b7 Partial \u00b7 3 of 7 axes";
    }
    return "unknown \u2014 not invented";
  }

  function peekHeight() {
    return Math.round(window.innerHeight * 0.64);
  }

  function fullHeight() {
    const probe = document.createElement("div");
    probe.style.cssText = "position:absolute;visibility:hidden;pointer-events:none;height:var(--st)";
    document.body.appendChild(probe);
    const st = probe.getBoundingClientRect().height || 0;
    document.body.removeChild(probe);
    return Math.max(peekHeight(), Math.round(window.innerHeight - st));
  }

  function applySheetSnap(mode) {
    sheetSnap = mode === "full" ? "full" : "peek";
    const sheet = document.getElementById("sheet");
    const dock = document.getElementById("dock");
    const handle = document.getElementById("sheetHandle");
    if (!sheet) return;
    if (isDesktop()) {
      sheet.classList.remove("snap-full", "dragging");
      sheet.style.height = "";
      if (dock) dock.classList.remove("tucked");
      if (handle) handle.setAttribute("aria-valuenow", "0");
      return;
    }
    sheet.classList.toggle("snap-full", sheetSnap === "full");
    if (dock) dock.classList.toggle("tucked", sheetSnap === "full");
    if (handle) handle.setAttribute("aria-valuenow", sheetSnap === "full" ? "1" : "0");
  }

  function resetSheetSnap() {
    sheetSnap = "peek";
    const sheet = document.getElementById("sheet");
    const dock = document.getElementById("dock");
    const handle = document.getElementById("sheetHandle");
    if (sheet) {
      sheet.classList.remove("snap-full", "dragging");
      sheet.style.height = "";
    }
    if (dock) dock.classList.remove("tucked");
    if (handle) handle.setAttribute("aria-valuenow", "0");
  }

  function bindSheetSnap() {
    const handle = document.getElementById("sheetHandle");
    const sheet = document.getElementById("sheet");
    if (!handle || !sheet) return;
    let drag = null;

    function clientY(e) {
      if (e.touches && e.touches.length) return e.touches[0].clientY;
      if (e.changedTouches && e.changedTouches.length) return e.changedTouches[0].clientY;
      return e.clientY;
    }

    function onDown(e) {
      if (isDesktop() || !sheet.classList.contains("open")) return;
      if (drag) return;
      if (e.pointerType === "mouse" && e.button !== 0) return;
      const y = clientY(e);
      if (y == null) return;
      drag = {
        startY: y,
        startH: sheet.getBoundingClientRect().height,
        lastY: y,
        lastT: performance.now(),
        vy: 0
      };
      sheet.classList.add("dragging");
      sheet.style.height = drag.startH + "px";
      if (e.pointerId != null && handle.setPointerCapture) {
        try { handle.setPointerCapture(e.pointerId); } catch (err) {}
      }
      e.preventDefault();
    }

    function onMove(e) {
      if (!drag) return;
      const y = clientY(e);
      if (y == null) return;
      const now = performance.now();
      const dt = now - drag.lastT;
      if (dt > 0) drag.vy = (y - drag.lastY) / dt;
      drag.lastY = y;
      drag.lastT = now;
      const next = Math.max(peekHeight(), Math.min(fullHeight(), drag.startH + (drag.startY - y)));
      sheet.style.height = next + "px";
      e.preventDefault();
    }

    function onUp() {
      if (!drag) return;
      const h = sheet.getBoundingClientRect().height;
      const peek = peekHeight();
      const full = fullHeight();
      let snap = (h - peek) >= (full - peek) * 0.5 ? "full" : "peek";
      if (drag.vy < -0.45) snap = "full";
      else if (drag.vy > 0.45) snap = "peek";
      drag = null;
      sheet.classList.remove("dragging");
      sheet.style.height = "";
      applySheetSnap(snap);
    }

    handle.addEventListener("pointerdown", onDown);
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
    handle.addEventListener("touchstart", onDown, { passive: false });
    window.addEventListener("touchmove", onMove, { passive: false });
    window.addEventListener("touchend", onUp);
    window.addEventListener("touchcancel", onUp);
  }

  function isAlreadyHere(item) {
    return item.stage === "open" || !!item.priced_in;
  }

  function isComingItem(item) {
    return item.stage !== "open";
  }

  function nowTickLabel() {
    const d = new Date();
    const mo = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    return d.getDate() + " " + mo[d.getMonth()] + " " + d.getFullYear();
  }

  function yearWindow(item) {
    if (item.guests_from) {
      const m = String(item.guests_from).match(/^(20\d{2})/);
      if (m) return "Guests " + m[1];
    }
    const w = item.window || item.date_or_window || item.meta || "";
    const seasonal = String(w).match(/\b((?:early|mid|late|winter|spring|summer|fall|autumn)\s+20\d{2})\b/i);
    if (seasonal) return seasonal[1];
    const y = String(w).match(/\b(20\d{2})\b/);
    if (y) return "Guests " + y[1];
    return null;
  }

  function comingLetter(item) {
    const s = String(item.name || item.brand || "?").replace(/^\s+/, "");
    return (s.charAt(0) || "?").toUpperCase();
  }

  function regionNoteFor(h) {
    const name = h.official_name || h.brand || "";
    if (/edition/i.test(name) || /edition/i.test(h.brand || "")) return "Nayarit \u00b7 unlocated";
    const town = h.town || "";
    if (/thompson/i.test(name) || (/puerto vallarta/i.test(town) && !h.town_id)) return "Puerto Vallarta";
    if (/milaroca|belmond/i.test(name)) return "Riviera Nayarit";
    if (/siari/i.test(name)) return "La Pe\u00f1ita de Jaltemba";
    if (/mandarina/i.test(name)) return "Mandarina";
    if (town) return town;
    return "unlocated";
  }

  function buildPipeline(hotelData) {
    const items = [];
    const wc = {};
    ((hotelData && hotelData.whats_coming_not_priced_in) || []).forEach(function (row) {
      if (row && row.name) wc[row.name] = row;
    });
    ((hotelData && hotelData.pvr_radius) || []).forEach(function (h) {
      const name = h.official_name || h.brand;
      const hit = wc[name];
      const townIds = h.town_id ? [h.town_id] : [];
      items.push({
        name: name,
        brand: h.brand,
        stage: h.stage,
        priced_in: !!h.priced_in,
        town_ids: townIds,
        regionNote: townIds.length ? null : regionNoteFor(h),
        guests_from: h.guests_from || null,
        date_or_window: h.date_or_window || null,
        window: (hit && hit.window) || null,
        dispute: h.dispute || null,
        kind: "hotel"
      });
    });
    const auto = CATALOG.autopista_las_varas_bucerias_pv;
    if (auto) {
      const ids = TOWNS.filter(function (t) {
        return (t.catalysts || []).indexOf("autopista_las_varas_bucerias_pv") !== -1;
      }).map(function (t) { return t.id; });
      items.push({
        name: auto.label,
        stage: auto.stage,
        priced_in: !!auto.priced_in,
        town_ids: ids,
        regionNote: null,
        guests_from: null,
        date_or_window: auto.meta || null,
        window: null,
        kind: "infra"
      });
    }
    const amado = CATALOG.puente_amado_nervo;
    if (amado) {
      items.push({
        name: amado.label,
        stage: amado.stage,
        priced_in: !!amado.priced_in,
        town_ids: ["nuevo-vallarta"],
        regionNote: null,
        guests_from: null,
        date_or_window: amado.meta || null,
        window: null,
        kind: "infra"
      });
    }
    const lit = CATALOG.litibu_bay_club;
    if (lit) {
      const hit = wc["Litib\u00fa Bay Club"];
      items.push({
        name: lit.label,
        stage: lit.stage,
        priced_in: !!lit.priced_in,
        town_ids: ["litibu"],
        regionNote: null,
        guests_from: null,
        date_or_window: lit.meta || (hit && hit.window) || null,
        window: (hit && hit.window) || null,
        kind: "infra"
      });
    }
    const teh = CATALOG.tehuamixtle_hotels;
    if (teh) {
      items.push({
        name: "Tehuamixtle / Mayto eco-hotels",
        stage: teh.stage,
        priced_in: !!teh.priced_in,
        town_ids: ["tehuamixtle"],
        regionNote: null,
        guests_from: null,
        date_or_window: null,
        window: null,
        kind: "infra"
      });
    }
    return items;
  }

  function itemsForTown(townId) {
    return PIPELINE.filter(function (it) { return it.town_ids.indexOf(townId) !== -1; });
  }

  function regionItems() {
    return PIPELINE.filter(function (it) { return !it.town_ids.length; });
  }

  function comingYearKey(item) {
    const w = yearWindow(item) || "";
    const y = w.match(/20\d{2}/);
    return y ? Number(y[0]) : 9999;
  }

  function partitionComing(list) {
    const here = [];
    const future = [];
    list.forEach(function (it) {
      if (isAlreadyHere(it)) here.push(it);
      else future.push(it);
    });
    future.sort(function (a, b) { return comingYearKey(a) - comingYearKey(b); });
    return { here: here, future: future };
  }

  function comingFilterBar() {
    const f = state.comingFilter || "all";
    const chip = function (id, label) {
      return '<button type="button" class="filter-chip' + (f === id ? " on" : "") + '" data-cfil="' + id + '">' + label + "</button>";
    };
    return '<div class="filters coming-fil">' + chip("all", "All") + chip("coming", "Coming") + chip("here", "Already here") + "</div>";
  }

  function comingRowHtml(item, i, showPlace) {
    const here = isAlreadyHere(item);

    const stageChip = here
      ? '<span class="chip here">already here</span>'
      : '<span class="chip ' + (STAGE_CHIP[item.stage] || "none") + '">' + esc(STAGE_LABEL[item.stage] || item.stage) + "</span>";
    const win = here ? null : yearWindow(item);
    let html = '<li class="coming-row' + (here ? " here" : "") + '">';
    html += '<div class="mono ' + pal + '" aria-hidden="true">' + esc(comingLetter(item)) + "</div>";
    html += '<div class="coming-body">';
    html += '<div class="coming-title">' + esc(item.name) + "</div>";
    if (showPlace && item.regionNote) html += '<div class="coming-place">' + esc(item.regionNote) + "</div>";
    html += '<div class="coming-meta">' + stageChip;
    if (item.dispute && item.dispute.status === "disputed") {
      html += '<span class="chip dispute">DISPUTED</span>';

    if (win) html += '<span class="coming-date">' + esc(win) + "</span>";
    html += "</div>";
    if (!here) html += '<div class="coming-hint">buy before it prices in</div>';
    if (item.dispute && item.dispute.status === "disputed" && item.dispute.rule) {
      html += '<div class="coming-hint coming-dispute">' + esc(item.dispute.rule) + "</div>";
    }
    html += "</div></li>";
    return html;
  }

  function comingTrackHtml(items, opts) {
    const showPlace = !!(opts && opts.showPlace);
    const f = state.comingFilter || "all";
    const parts = partitionComing(items);
    const showHere = f === "all" || f === "here";
    const showFut = f === "all" || f === "coming";
    const hereV = showHere ? parts.here : [];
    const futV = showFut ? parts.future.filter(isComingItem) : [];
    if (!hereV.length && !futV.length) return '<p class="coming-empty">Nothing new on file.</p>';
    let html = '<ol class="coming-list">';
    hereV.forEach(function (it, i) { html += comingRowHtml(it, i, showPlace); });
    html += '<li class="coming-now"><span class="coming-now-tick"></span><span class="coming-now-lab">NOW \u00b7 ' + esc(nowTickLabel()) + "</span></li>";
    futV.forEach(function (it, i) { html += comingRowHtml(it, i + hereV.length, showPlace); });
    html += "</ol>";
    return html;
  }

  function comingHtml(t) {
    let html = '<div class="coming"><div class="group-h">What\'s coming</div>';

  function loadData() {
    return Promise.all([
      fetch("pvr-towns-aug2026.json", { cache: "no-store" }).then(function (r) {
        if (!r.ok) throw new Error("fetch " + r.status);
        return r.json();
      }),
      fetch("hotel-pipeline-aug2026.json", { cache: "no-store" }).then(function (r) {
        if (!r.ok) throw new Error("hotels " + r.status);
        return r.json();
      }),

  function ingestScores(scoreData) {
    SCORES_META = (scoreData && scoreData.meta) || null;
    SCORES = {};
    ((scoreData && scoreData.scored) || []).forEach(function (row) {
      if (row && row.id) SCORES[row.id] = row;

  function boot(data, hotelData, scoreData) {
    DATASET = data;
    CATALOG = data.catalysts_catalog || {};
    HURR_REGION = data.hurricane_region || null;
    TOWNS = (data.towns || []).map(function (t) {
      return Object.assign({}, t, { off_map: false });
    });
    CABO = (data.peers_off_map && data.peers_off_map[0]) ? Object.assign({}, data.peers_off_map[0], {
      peer: true,
      off_map: true,
      catalysts: [],
      hurricane: { note: null },
      drive_min_to_pvr: { basis: "off_map", label: "off-map" },
      access: "off_map"
    }) : null;
    CC = TOWNS.find(function (t) { return t.id === "conchas-chinas"; }) || null;
    PIPELINE = buildPipeline(hotelData || {});
    ingestScores(scoreData || {});

    const brandH = document.querySelector(".brand h1");
    if (brandH) brandH.textContent = BRAND.short;
    const tm = document.querySelector('meta[name="theme-color"]');
    if (tm) tm.setAttribute("content", brandColor("--bg"));

    if (preview) {
      const qa = document.getElementById("qaChip");
      if (qa) qa.hidden = false;
    }

    const pvr = data.meta && data.meta.center
      ? [data.meta.center.lat, data.meta.center.lng]
      : [20.68083, -105.25556];

    map = L.map("map", { zoomControl: false, attributionControl: false, minZoom: 7, maxZoom: 13 }).setView(pvr, 9);
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
      attribution: "", maxZoom: 16
    }).addTo(map);

    const accent = brandColor("--accent");
    radius = L.circle(pvr, {
      radius: 90 * 700, color: accent, weight: 1.2, dashArray: "5 8",
      fillColor: accent, fillOpacity: 0.05, interactive: false
    }).addTo(map);

    L.marker(pvr, {
      icon: L.divIcon({ className: "", html: '<div class="airport">PVR</div>', iconSize: [22, 22] }),
      zIndexOffset: 500, interactive: false
    }).addTo(map);

    TOWNS.forEach(function (t) {
      const m = L.marker([t.lat, t.lng], { icon: iconFor(t), keyboard: true, title: t.name }).addTo(map);
      m.on("click", function () { onTownTap(t.id, "map"); });
      markers[t.id] = m;
    });

    document.querySelector(".drive").addEventListener("click", function (e) {
      const b = e.target.closest("button");
      if (b) setMinutes(Number(b.dataset.min));
    });

    document.getElementById("openList").onclick = function () { openView("list"); };
    document.getElementById("openSettings").onclick = function () { openSettings(); };

    const credit = document.getElementById("mapCredit");
    if (credit) {
      credit.onclick = function () {
        const open = credit.classList.toggle("open");
        credit.setAttribute("aria-expanded", open ? "true" : "false");
      };
    }

    window.addEventListener("resize", onResize);
    bindSheetSnap();
    setMinutes(90);
    if (isDesktop()) openView("list");
    else {
      paintDock();
      measureDock();
    }
  }

  function markerClass(t) {
    const sel = state.selected === t.id || state.compare.indexOf(t.id) !== -1;
    let c = "dot";
    if (t.access === "boat") c += " boat";
    const tier = tierOf(t);
    if (tier === "primary") c += " primary";
    else if (tier === "unknown") c += " unknown";
    if (!unlocked(t.id)) c += " locked";
    if (sel) c += " sel";
    return c;
  }

  function iconFor(t) {
    return L.divIcon({
      className: "",
      html: '<div class="' + markerClass(t) + '"></div><div class="lbl">' + esc(shortName(t)) + "</div>",
      iconSize: [14, 14]
    });
  }

  function refreshMarkers() {
    TOWNS.forEach(function (t) {
      markers[t.id].setIcon(iconFor(t));
      if (inRadius(t)) {
        if (!map.hasLayer(markers[t.id])) markers[t.id].addTo(map);
        markers[t.id].setOpacity(1);
      } else if (map.hasLayer(markers[t.id])) {
        map.removeLayer(markers[t.id]);
      }
    });
    const n = TOWNS.filter(inRadius).length;
    document.getElementById("count").textContent = n + " towns · " + state.minutes + " min";
  }

  function setMinutes(min) {
    state.minutes = min;
    document.querySelectorAll(".drive button").forEach(function (b) {
      b.classList.toggle("on", Number(b.dataset.min) === min);
    });
    radius.setRadius(min * 700);
    refreshMarkers();
    const vis = TOWNS.filter(inRadius);
    if (vis.length) {
      const pvr = DATASET.meta.center;
      const b = L.latLngBounds(vis.map(function (t) { return [t.lat, t.lng]; }));
      b.extend([pvr.lat, pvr.lng]);
      map.fitBounds(b.pad(0.18), { animate: true, maxZoom: min <= 30 ? 11 : min <= 60 ? 10 : 9 });
    }
    if (state.view === "list") paintSheet();
  }

  function onTownTap(id, src) {
    const t = town(id);
    if (!t) return;
    if (!unlocked(id)) {
      openPro(id);
      return;
    }
    if (src === "list" || src === "map") addToCompare(id);
    if (src === "map" || src === "list-detail") openView("detail", id);
    else {
      paintDock();
      refreshMarkers();
      if (state.view === "list") paintSheet();
    }
  }

  function addToCompare(id) {
    if (!unlocked(id)) {
      openPro(id);
      return false;
    }
    if (state.compare.indexOf(id) !== -1) return true;
    if (state.compare.length >= 4) {
      showToast("Compare is capped at 4 towns");
      return false;
    }
    state.compare.push(id);
    paintDock();
    refreshMarkers();
    return true;
  }

  function removeFromCompare(id) {
    state.compare = state.compare.filter(function (x) { return x !== id; });
    paintDock();
    refreshMarkers();
    if (state.view === "compare") {
      if (state.compare.length) paintSheet();
      else openView(isDesktop() ? "list" : "map");
    }
  }

  function openPro(id) {
    state.proId = id;
    const t = town(id);
    const modal = document.getElementById("modal");
    modal.hidden = false;
    modal.innerHTML =
      '<div class="modal-card" role="dialog" aria-labelledby="proTitle">' +
      '<h2 id="proTitle">' + esc(BRAND.name) + " Pro</h2>" +
      '<p class="meta" style="margin:0 0 10px">' + esc(t ? t.name : "This pin") + " is locked on the free PVR map.</p>" +
      "<p>Free towns: Bucerías, Nuevo Vallarta, Sayulita, Punta Mita, Conchas Chinas. Other pins and Cabo Médano are Pro.</p>" +
      '<div class="price-pair"><span>$19 / mo</span><span>$99 / yr</span></div>' +
      '<p class="caption">No invented asking USD/m². Unknown stays unknown.</p>' +
      '<button type="button" class="btn-a" id="closePro" style="width:100%">Close</button></div>';
    document.getElementById("closePro").onclick = closePro;
    modal.onclick = function (e) { if (e.target === modal) closePro(); };
  }

  function openSettings() {
    const modal = document.getElementById("modal");
    const plan = getPlan();
    modal.hidden = false;
    modal.innerHTML =
      '<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">' +
      '<div class="sheet-head" style="margin-bottom:8px">' +
      '<h2 id="settingsTitle">Settings</h2>' +
      '<button type="button" class="x" id="closeSettings" aria-label="Close">\u00d7</button></div>' +
      '<div class="settings-row">' +
      '<span class="settings-lab">View</span>' +
      '<div class="plan-row" id="planChips">' +
      '<button type="button" class="filter-chip' + (plan === "light" ? " on" : "") + '" data-plan="light">Light</button>' +
      '<button type="button" class="filter-chip' + (plan === "pro" ? " on" : "") + '" data-plan="pro">Pro</button>' +
      "</div></div>" +
      '<p class="caption">Light is the free PVR map. Pro unlocks every town on file.</p>' +
      "</div>";
    bindSettingsChips();
    document.getElementById("closeSettings").onclick = closePro;
    modal.onclick = function (e) { if (e.target === modal) closePro(); };
  }

  function closePro() {
    const modal = document.getElementById("modal");
    modal.hidden = true;
    modal.innerHTML = "";
    state.proId = null;
  }

  function showToast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { el.hidden = true; }, 2200);
  }

  function openView(view, id) {
    closeDefine();
    if (view === "detail") state.selected = id;
    if (view === "map") state.selected = null;
    state.view = view;
    const sheet = document.getElementById("sheet");
    if (view === "map" && !isDesktop()) {
      sheet.classList.remove("open", "compare-mode");
      resetSheetSnap();
      paintDock();
      refreshMarkers();
      return;
    }
    resetSheetSnap();
    sheet.classList.add("open");
    paintSheet();
    paintDock();
    refreshMarkers();
    if (view === "detail" && id) {
      const t = town(id);
      if (t && t.lat != null) map.panTo([t.lat, t.lng], { animate: true });
    }
  }

  function paintDock() {
    const dock = document.getElementById("dock");
    const chips = state.compare.map(function (id) {
      const t = town(id);
      return '<div class="dock-chip"><span>' + esc(shortName(t)) + '</span><button type="button" data-rm="' + esc(id) + '" aria-label="Remove">×</button></div>';
    }).join("");
    const empties = state.compare.length ? "" : '<div class="dock-empty">Tap towns · up to 4</div>';
    dock.innerHTML =
      '<div class="dock-chips" id="dockChips">' + chips + empties + "</div>" +
      '<div class="dock-actions">' +
      '<button type="button" class="clear-compare" id="clearCmp"' + (state.compare.length ? "" : " hidden") + ">Clear</button>" +
      '<button type="button" class="go-compare" id="goCmp"' + (state.compare.length >= 2 ? "" : " disabled") + ">Compare</button>" +
      "</div>";
    dock.querySelectorAll("[data-rm]").forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        removeFromCompare(b.getAttribute("data-rm"));
      };
    });
    document.getElementById("goCmp").onclick = function () {
      if (state.compare.length >= 2) openView("compare");
    };
    document.getElementById("clearCmp").onclick = function () {
      state.compare = [];
      paintDock();
      refreshMarkers();
      if (state.view === "compare") openView(isDesktop() ? "list" : "map");
    };
    measureDock();
  }

  function measureDock() {
    const dock = document.getElementById("dock");
    const app = document.getElementById("app");
    if (!dock || !app) return;
    const h = Math.ceil(dock.getBoundingClientRect().height);
    app.style.setProperty("--dock-h", (h > 0 ? h : 88) + "px");
  }

  function onResize() {
    measureDock();
    if (map) map.invalidateSize();
    if (isDesktop() && state.view === "map") openView("list");
    if (isDesktop()) resetSheetSnap();
    else if (document.getElementById("sheet") && document.getElementById("sheet").classList.contains("open")) {
      applySheetSnap(sheetSnap);
    }
  }

  function ranked() {
    const priced = allPlaces().filter(function (t) { return headlineOf(t) != null; })
      .sort(function (a, b) { return headlineOf(b) - headlineOf(a); })
      .map(function (t, i) { return Object.assign({ _rank: i + 1 }, t); });
    const unk = allPlaces().filter(function (t) { return headlineOf(t) == null; })
      .map(function (t) { return Object.assign({ _rank: null }, t); });
    return { priced: priced, unk: unk };
  }

  function filterTowns(list) {
    if (state.listFilter === "all") return list;
    if (state.listFilter === "coming") {
      return list.filter(function (t) {
        return itemsForTown(t.id).some(isComingItem);
      });
    }
    return list.filter(function (t) { return tierOf(t) === state.listFilter; });
  }

  function listHtml() {
    const groups = ranked();
    let priced = filterTowns(groups.priced);
    let unk = state.listFilter === "primary" || state.listFilter === "priced" ? [] : filterTowns(groups.unk);
    if (state.listSort === "drive") {
      const key = function (t) { return driveKey(t); };
      priced = priced.slice().sort(function (a, b) { return key(a) - key(b); });
      unk = unk.slice().sort(function (a, b) { return key(a) - key(b); });
    } else if (state.listSort === "score") {
      const byScore = function (a, b) {
        const sa = scoreOf(a), sb = scoreOf(b);
        if (sa == null && sb == null) return 0;
        if (sa == null) return 1;
        if (sb == null) return -1;
        return sb - sa;
      };
      priced = priced.slice().sort(byScore);
      unk = unk.slice().sort(byScore);
    }
    const ccH = headlineOf(CC);
    const caboH = headlineOf(CABO);
    const fil = function (id, label) {
      return '<button type="button" class="filter-chip' + (state.listFilter === id ? " on" : "") + '" data-fil="' + id + '">' + label + "</button>";
    };
    let html = '<div class="sheet-head"><div><h2>Ranks</h2><div class="meta">Verified asking USD/m² only · Aug 2026 · partial score on 3 of 7 axes</div></div>';
    if (!isDesktop()) html += '<button type="button" class="x" id="closeSheet" aria-label="Close">×</button>';
    html += "</div>";
    html += '<div class="filters">' + fil("all", "All") + fil("primary", "Primary") + fil("priced", "Priced") + fil("unknown", "Unknown") + fil("coming", "Coming") + "</div>";
    html += '<div class="sort-row">' +
      '<button type="button" class="sort-chip' + (state.listSort === "price" ? " on" : "") + '" data-sort="price">By USD/m²</button>' +
      '<button type="button" class="sort-chip' + (state.listSort === "drive" ? " on" : "") + '" data-sort="drive">By drive</button>' +
      '<button type="button" class="sort-chip' + (state.listSort === "score" ? " on" : "") + '" data-sort="score">By score</button></div>';
    html += '<div class="legend"><span><i style="background:var(--sand)"></i>PRIMARY peer + headline</span><span><i style="background:var(--mint)"></i>PRICED headline</span><span><i style="background:var(--unk)"></i>UNKNOWN</span></div>';

    function row(t) {
      const h = headlineOf(t);
      const vscc = vsFmt(h, ccH);
      const vscb = vsFmt(h, caboH);
      const locked = !unlocked(t.id);
      const inCmp = state.compare.indexOf(t.id) !== -1;
      const sc = scoreOf(t);
      const left = state.listSort === "drive" ? esc(driveLabel(t).replace(" est.", ""))
        : state.listSort === "score" ? (sc == null ? "—" : String(sc))
        : (t._rank == null ? "—" : String(t._rank));
      return '<div class="rank-line">' +
        '<button type="button" class="rank-row" data-id="' + esc(t.id) + '">' +
        '<div class="rank-num">' + left + "</div>" +
        '<div class="rank-name">' + esc(shortName(t)) +
        (locked ? '<span class="lock-ico">Pro</span>' : "") +
        (t.off_map ? '<span class="chip lock">off-map</span>' : "") +
        (inCmp ? '<span class="chip priced">in compare</span>' : "") +
        '<span class="chip ' + tierOf(t) + '">' + tierOf(t).toUpperCase() + "</span></div>" +
        '<div class="rank-usd' + (h == null ? " unk" : "") + '">' + (h == null ? "unknown" : (locked ? "Pro" : fmtUsd(h))) + "</div>" +
        '<div class="rank-meta"><span class="vs ' + ((locked && h != null) ? "" : vscc.cls) + '">vs Conchas Chinas ' + esc((locked && h != null) ? "Pro" : vscc.text) + "</span>" +
        '<span class="vs ' + ((locked && h != null) ? "" : vscb.cls) + '">vs Cabo Médano ' + esc((locked && h != null) ? "Pro" : vscb.text) + "</span>" +
        '<span class="score-col">score ' + (sc == null ? "—" : String(sc)) + "</span>" +
        (state.listSort === "price" ? "<span>" + esc(driveLabel(t)) + "</span>" : "") +
        "</div></button>" +
        '<button type="button" class="icon-btn" data-detail="' + esc(t.id) + '" aria-label="Open ' + esc(shortName(t)) + '">i</button></div>';
    }

    if (priced.length) {
      html += '<div class="group-h">' + (state.listSort === "drive" ? "By estimated drive to PVR" : state.listSort === "score" ? "By partial score" : "Ranked by asking USD/m²") + "</div>";
      html += priced.map(row).join("");
    }
    if (unk.length) {
      html += '<div class="group-h">Unknown price · not ranked</div>';
      html += unk.map(row).join("");
    }
    if (!priced.length && !unk.length) html += '<p class="caption">No towns in this filter.</p>';
    html += '<p class="caption">Peer is Conchas Chinas ' + esc(fmtUsd(ccH)) + ' (Homia). Cabo Médano is MLS BCS, off-map, Pro-locked. AMPI municipal averages are not USD/m² and are not used to rank. Score is a PARTIAL grade (3 of 7 axes). Cabo and towns without a scored row stay —. Drive times are estimated.</p>';
    if (HURR_REGION && HURR_REGION.noaa_since_1945) {
      html += '<p class="caption">Region: ' + esc(HURR_REGION.noaa_since_1945) + " Not stamped on each town.</p>";
    }
    html += regionComingHtml();
    return html;
  }

  function detailHtml(t) {
    const h = headlineOf(t);
    const unknown = h == null;
    const inCmp = state.compare.indexOf(t.id) !== -1;
    const vscc = vsFmt(h, headlineOf(CC));
    const vscb = vsFmt(h, headlineOf(CABO));
    let html = '<div class="sheet-head"><div><h2>' + esc(t.name) + "</h2>" +
      '<div class="meta">' + esc(driveLabel(t)) + " · " + tierOf(t).toUpperCase() + (t.peer ? " · peer" : "") + (t.off_map ? " · off-map" : "") + "</div></div>" +
      '<button type="button" class="x" id="closeSheet" aria-label="Close">×</button></div>';
    html += '<div class="price-card"><div class="k">Asking USD/m² · Aug 2026</div>';
    html += '<div class="v' + (unknown ? " unk" : "") + '">' + (unknown ? "unknown" : fmtUsd(h)) + "</div>";
    html += '<div class="rows">';
    if (!unknown) {
      html += "<div><span>Source</span><b>" + esc(t.usd_m2.source || "—") + "</b></div>";
      if (t.usd_m2.n != null) html += "<div><span>n</span><b>" + esc(String(t.usd_m2.n)) + "</b></div>";
      if (t.usd_m2.band) html += "<div><span>Band</span><b>" + esc(t.usd_m2.band) + "</b></div>";
      html += '<div><span>vs Conchas Chinas</span><b class="vs ' + vscc.cls + '">' + esc(vscc.text) + "</b></div>";
      html += '<div><span>vs Cabo Médano</span><b class="vs ' + vscb.cls + '">' + esc(vscb.text) + "</b></div>";
    } else {
      html += "<div><span>Seed</span><b>unknown — not invented</b></div>";
      if (t.ampi_not_mls) {
        html += "<div><span>AMPI (not MLS)</span><b>not used as USD/m²</b></div>";
      }
    }
    const sc = scoreOf(t);
    html += '<div><span>Score</span><b>';
    if (sc == null) {
      html += "—";
    } else {
      html += '<button type="button" class="score-tap" data-metric="score" aria-haspopup="dialog">' +
        esc(String(sc)) + " " + partialChip() + "</button>";
    }
    html += "</b></div>";
    html += "</div></div>";

    html += partialGradeHtml(t);

    html += comingHtml(t);
    html += homesHtml();

    html += '<div class="actions">';
    html += '<button type="button" class="btn-a" id="addCmp">' + (inCmp ? "In compare" : "Add to compare") + "</button>";
    if (isDesktop()) html += '<button type="button" class="btn-ghost" id="backList">All towns</button>';
    html += "</div>";
    return html;
  }

  function compareHtml() {
    const towns = state.compare.map(town).filter(Boolean);
    let html = '<div class="sheet-head"><div><h2>Compare</h2><div class="meta">' + towns.length + " of 4 · metrics from file · Aug 2026</div></div>" +
      '<button type="button" class="x" id="closeSheet" aria-label="Close">×</button></div>';

    html += '<div class="filters" id="cmpPicker">';
    allPlaces().forEach(function (t) {
      const on = state.compare.indexOf(t.id) !== -1;
      const lock = !unlocked(t.id);
      html += '<button type="button" class="filter-chip' + (on ? " on" : "") + '" data-pick="' + esc(t.id) + '">' +
        esc(shortName(t)) + (lock ? " · Pro" : "") + (t.off_map ? " · off-map" : "") + "</button>";
    });
    html += "</div>";

    function metricTh(key, label) {
      return '<th><button type="button" class="metric-lab" data-metric="' + key + '">' + label + "</button></th>";
    }
    function cells(fn) {
      return towns.map(function (t) { return "<td>" + fn(t) + "</td>"; }).join("");
    }

    html += '<div class="cmp-wrap' + (towns.length >= 3 ? " cmp-many" : "") + '"><table class="cmp-table"><thead><tr><th></th>';
    towns.forEach(function (t) {
      html += "<th>" + esc(shortName(t)) + "</th>";
    });
    html += "</tr></thead><tbody>";

    html += "<tr>" + metricTh("usd", "Asking USD/m²") + cells(function (t) {
      const h = headlineOf(t);
      return h == null ? '<span class="rank-usd unk">unknown</span>' : esc(fmtUsd(h));
    }) + "</tr>";
    html += "<tr>" + metricTh("source", "Source");
    towns.forEach(function (t) {
      const src = (t.usd_m2 && t.usd_m2.source) || (headlineOf(t) == null ? "unknown" : "—");
      html += '<td title="' + esc(src) + '">' + esc(src) + "</td>";
    });
    html += "</tr>";
    html += "<tr>" + metricTh("n", "n") + cells(function (t) {
      return t.usd_m2 && t.usd_m2.n != null ? esc(String(t.usd_m2.n)) : "—";
    }) + "</tr>";
    html += "<tr>" + metricTh("drive", "Drive to PVR") + cells(function (t) { return esc(driveLabel(t)); }) + "</tr>";
    html += "<tr>" + metricTh("catalysts", "Catalysts");
    towns.forEach(function (t) {
      const cats = catalystObjs(t);
      if (!cats.length) {
        html += '<td data-metric="catalysts">—</td>';
        return;
      }
      const full = cats.map(function (c) { return c.label; }).join(", ");
      const shown = cats.length === 1 ? cats[0].label : (cats.length + " catalysts");
      html += '<td data-metric="catalysts" title="' + esc(full) + '">' + esc(shown) + "</td>";
    });
    html += "</tr>";
    const anyHurr = towns.some(function (t) { return t.hurricane && t.hurricane.note; });
    if (anyHurr) {
      html += "<tr>" + metricTh("storm", "Hurricane");
      towns.forEach(function (t) {
        const note = t.hurricane && t.hurricane.note ? t.hurricane.note : "—";
        html += '<td title="' + esc(note) + '">' + esc(note) + "</td>";
      });
      html += "</tr>";
    }
    html += "<tr>" + metricTh("vscc", "vs Conchas Chinas") + cells(function (t) {
      const v = vsFmt(headlineOf(t), headlineOf(CC));
      return '<span class="vs ' + v.cls + '">' + esc(v.text) + "</span>";
    }) + "</tr>";
    html += "<tr>" + metricTh("score", "Score") + cells(function (t) {
      const s = scoreOf(t);
      return s == null ? "—" : esc(String(s));
    }) + "</tr>";
    html += "</tbody></table></div>";

    const graded = towns.filter(function (t) { return !!scoreRow(t); });
    if (graded.length) {
      html += '<div class="group-h">Partial grade · 3 of 7 axes</div>';
      html += '<div class="facts-grid" style="grid-template-columns:repeat(' + graded.length + ',minmax(140px,1fr))">';
      graded.forEach(function (t) {
        const row = scoreRow(t);
        const sc = scoreOf(t);
        html += '<div class="fact-col"><h3>' + esc(shortName(t)) + "</h3>";
        html += "<div><span>Score</span><b>" + (sc == null ? "—" : esc(String(sc))) + "</b></div>";
        SCORED_AXES.forEach(function (ax) {
          const v = axisScore(row, ax.key);
          html += "<div><span>" + esc(ax.label) + "</span><b>" + (v == null ? "—" : esc(String(v))) + "</b></div>";
        });
        html += '<div><span></span><b>' + partialChip() + "</b></div>";
        html += "</div>";
      });
      html += "</div>";
    } else {
      html += '<p class="caption">no spider — unknown USD/m²</p>';
    }
    if (isDesktop()) html += '<div class="actions"><button type="button" class="btn-ghost" id="backList">All towns</button></div>';
    return html;
  }

  function paintSheet() {
    const body = document.getElementById("sheetBody");
    if (state.view === "compare") body.innerHTML = compareHtml();
    else if (state.view === "detail" && state.selected) body.innerHTML = detailHtml(town(state.selected));
    else body.innerHTML = listHtml();

    const close = document.getElementById("closeSheet");
    if (close) close.onclick = function () {
      if (isDesktop()) openView("list");
      else openView("map");
    };
    const back = document.getElementById("backList");
    if (back) back.onclick = function () { openView("list"); };
    const add = document.getElementById("addCmp");
    if (add) add.onclick = function () {
      addToCompare(state.selected);
      paintSheet();
    };
    body.querySelectorAll("[data-fil]").forEach(function (b) {
      b.onclick = function () {
        state.listFilter = b.getAttribute("data-fil");
        if (state.listFilter === "coming") state.comingFilter = "coming";
        paintSheet();
      };
    });
    body.querySelectorAll("[data-sort]").forEach(function (b) {
      b.onclick = function () { state.listSort = b.getAttribute("data-sort"); paintSheet(); };
    });
    body.querySelectorAll("[data-pick]").forEach(function (b) {
      b.onclick = function () {
        const id = b.getAttribute("data-pick");
        if (!unlocked(id)) { openPro(id); return; }
        if (state.compare.indexOf(id) !== -1) removeFromCompare(id);
        else addToCompare(id);
        paintSheet();
      };
    });
    body.querySelectorAll(".rank-row").forEach(function (b) {
      b.onclick = function () {
        const id = b.getAttribute("data-id");
        if (!unlocked(id)) { openPro(id); return; }
        addToCompare(id);
        paintSheet();
      };
    });
    body.querySelectorAll("[data-detail]").forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        const id = b.getAttribute("data-detail");
        if (!unlocked(id)) { openPro(id); return; }
        openView("detail", id);
      };
    });
    body.querySelectorAll("[data-axis]").forEach(function (b) {
      b.onclick = function () {
        const t = town(state.selected);
        if (t) openDefine(b.getAttribute("data-axis"), t);
      };
    });
    body.querySelectorAll("[data-metric]").forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        const key = b.getAttribute("data-metric");
        openDefine(key, town(state.compare[0]) || town(state.selected));
      };
    });
    body.querySelectorAll("[data-cfil]").forEach(function (b) {
      b.onclick = function () {
        state.comingFilter = b.getAttribute("data-cfil");
        paintSheet();
      };
    });
  }

  loadData().then(function (triple) { boot(triple[0], triple[1], triple[2]); }).catch(function (err) {
    const el = document.getElementById("sheetBody");
    if (el) el.innerHTML = "<p class=\"caption\">Could not load pvr-towns-aug2026.json / scores-aug2026.json. Serve this folder over http.</p>";
    document.getElementById("sheet").classList.add("open");
    console.error(err);
  });
})();

</script>
</body>
</html>
