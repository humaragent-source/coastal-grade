<!DOCTYPE html>
<html lang="en">
<head>

<meta name="theme-color" content="#0F1419"/>
<title>Coastal Grade · PVR</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<style>
:root{
  --bg:#0F1419;
  --bg-deep:#03080c;
  --coral:#FF6B47;
  --gold:#FFD166;
  --teal:#4A9D9C;
  --purple:#A78BFA;
  --green:#3FB950;
  --coral-d:rgba(255,107,71,.16);
  --gold-d:rgba(255,209,102,.16);
  --teal-d:rgba(74,157,156,.16);
  --purple-d:rgba(167,139,250,.16);
  --green-d:rgba(63,185,80,.16);
  --map-bg:#08141c;
  --sticky:#08181f;
  --toast:#12303a;
  --foam:#e7fbf6;
  --dim:#9bbfb8;
  --muted:#6f8f94;
  --line:rgba(180,230,220,.12);
  --sheet:rgba(8,18,24,.94);
  --accent:#3eebc9;
  --accent-ink:#052019;
  --accent-d:rgba(62,235,201,.16);
  --warn:#e6c878;
  --warn-d:rgba(230,200,120,.16);
  --danger:#ff7a6a;
  --info:#7ab3ff;
  --uc:#ffb020;
  --rumor:#c9a0ff;
  --unk:#4a6a72;
  --label:#cfeae4;
  --danger-soft:#ffd0c8;
  --dispute:#ffd8a0;
  --radar-ink:#9ec9c8;
  --radar-grid:rgba(90,180,190,.18);
  --vignette:rgba(6,16,22,.55);
  --vignette-end:rgba(6,16,22,.25);
  --accent-06:rgba(62,235,201,.06);
  --accent-08:rgba(62,235,201,.08);
  --accent-1:rgba(62,235,201,.1);
  --accent-22:rgba(62,235,201,.22);
  --accent-28:rgba(62,235,201,.28);
  --accent-3:rgba(62,235,201,.3);
  --accent-35:rgba(62,235,201,.35);
  --accent-55:rgba(62,235,201,.55);
  --accent-7:rgba(62,235,201,.7);
  --accent-9:rgba(62,235,201,.9);
  --warn-08:rgba(230,200,120,.08);
  --warn-12:rgba(230,200,120,.12);
  --warn-18:rgba(230,200,120,.18);
  --warn-25:rgba(230,200,120,.25);
  --warn-28:rgba(230,200,120,.28);
  --warn-3:rgba(230,200,120,.3);
  --warn-45:rgba(230,200,120,.45);
  --warn-95:rgba(230,200,120,.95);
  --danger-08:rgba(255,122,106,.08);
  --danger-22:rgba(255,122,106,.22);
  --uc-12:rgba(255,176,32,.12);
  --uc-14:rgba(255,176,32,.14);
  --uc-3:rgba(255,176,32,.3);
  --uc-4:rgba(255,176,32,.4);
  --info-12:rgba(122,179,255,.12);
  --info-3:rgba(122,179,255,.3);
  --rumor-12:rgba(201,160,255,.12);
  --rumor-3:rgba(201,160,255,.3);
  --unk-ring:rgba(150,180,180,.25);
  --unk-glow:rgba(80,110,120,.3);
  --foam-16:rgba(231,251,246,.16);
  --sheet-72:rgba(8,18,24,.72);
  --sheet-78:rgba(8,18,24,.78);
  --sheet-9:rgba(8,18,24,.9);
  --sheet-92:rgba(8,18,24,.92);
  --overlay:rgba(3,8,12,.58);
  --overlay-soft:rgba(3,8,12,.55);
  --white-03:rgba(255,255,255,.03);
  --white-04:rgba(255,255,255,.04);
  --white-05:rgba(255,255,255,.05);
  --white-06:rgba(255,255,255,.06);
  --white-18:rgba(255,255,255,.18);
  --shadow:rgba(0,0,0,.45);
  --mint:var(--accent);
  --mint-d:var(--accent-d);
  --sand:var(--warn);
  --sand-d:var(--warn-d);
  --storm:var(--danger);
  --tender:var(--info);
  --font-display:Syne,sans-serif;
  --font-body:"DM Sans",system-ui,sans-serif;
  --radius-sheet:22px;
  --radius-chip:999px;
  --radius-card:16px;
  --space-1:4px;
  --space-2:6px;
  --space-3:8px;
  --space-4:10px;
  --space-5:12px;
  --space-6:14px;
  --space-7:16px;
  --sb:env(safe-area-inset-bottom,0px);
  --st:env(safe-area-inset-top,0px);
  --sl:env(safe-area-inset-left,0px);
  --sr:env(safe-area-inset-right,0px);
  --dock-h:88px;
  --rail-w:50%
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100dvh;width:100%;margin:0;background:var(--bg-deep);color:var(--foam);font-family:var(--font-body);overflow:hidden;overscroll-behavior:none}
#app{height:100dvh;width:100%;position:relative;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
#stage{position:absolute;inset:0;overflow:hidden}
#map{position:absolute;inset:0;background:var(--map-bg)}
.leaflet-container{background:var(--map-bg);font-family:inherit}
.leaflet-control-attribution{display:none!important}
.leaflet-attribution-flag,.leaflet-control-attribution svg,.leaflet-control-attribution img{display:none!important}
.leaflet-control-zoom{display:none}
.vignette{pointer-events:none;position:absolute;inset:0;z-index:400;background:radial-gradient(120% 70% at 50% 100%,var(--vignette),transparent 55%),linear-gradient(180deg,var(--vignette) 0%,transparent 18%,transparent 70%,var(--vignette-end) 100%)}
.topbar{position:absolute;top:0;left:0;right:0;z-index:800;padding:calc(10px + var(--st)) 14px 0 calc(14px + var(--sl));display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.brand h1{font-family:var(--font-display);font-weight:800;letter-spacing:.04em;font-size:15px;margin:0;line-height:1.1}
.brand .sub{font-size:10.5px;color:var(--dim);letter-spacing:.04em;margin-top:2px}
.top-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.seed-chip,.list-btn,.qa-chip{font-size:10px;border-radius:var(--radius-chip);padding:6px 9px;white-space:nowrap;border:1px solid var(--warn-25);display:inline-flex;align-items:center;justify-content:center}
.seed-chip{color:var(--sand);background:var(--sand-d)}
.qa-chip{color:var(--mint);background:var(--mint-d);border-color:var(--accent-3)}
.qa-chip[hidden]{display:none!important}
.list-btn{color:var(--foam);background:var(--sheet-78);border-color:var(--line);cursor:pointer;font:600 12px/1 var(--font-body);min-height:44px;min-width:44px}
.drive{position:absolute;top:calc(58px + var(--st));left:calc(12px + var(--sl));right:calc(12px + var(--sr));z-index:800;display:flex;gap:6px;padding:4px;background:var(--sheet-78);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px)}
.drive button{flex:1;border:0;background:transparent;color:var(--dim);font:600 11px/1 var(--font-body);padding:9px 2px;border-radius:11px;cursor:pointer;min-height:44px}
.drive button.on{background:var(--mint-d);color:var(--mint)}
.drive-label{position:absolute;top:calc(118px + var(--st));left:calc(16px + var(--sl));z-index:800;font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;line-height:1.2}
.count-pill{position:absolute;top:calc(116px + var(--st));right:calc(14px + var(--sr));z-index:800;font-size:11px;color:var(--foam);background:var(--sheet-78);border:1px solid var(--line);border-radius:var(--radius-chip);padding:5px 9px}

.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--accent-35),0 0 12px var(--accent-35);background:var(--mint);transform:translate(-7px,-7px)}
.dot.unknown{background:var(--purple);box-shadow:0 0 0 1px rgba(167,139,250,.4),0 0 8px rgba(167,139,250,.3)}
.dot.primary{background:var(--coral);width:16px;height:16px;transform:translate(-8px,-8px);box-shadow:0 0 0 1px rgba(255,107,71,.45),0 0 14px rgba(255,107,71,.45)}
.dot.locked{opacity:.72}
.dot.sel{box-shadow:0 0 0 3px var(--accent-55),0 0 18px var(--accent-7)}
.dot.boat{border-radius:4px}
.airport{width:22px;height:22px;transform:translate(-11px,-11px);border-radius:6px;background:var(--toast);border:1px solid var(--mint);display:grid;place-items:center;color:var(--mint);font-size:10px;font-weight:700;box-shadow:0 0 16px var(--accent-35)}
.lbl{background:none;border:0;box-shadow:none;font-size:10px;font-weight:600;color:var(--label);text-shadow:0 1px 4px var(--bg),0 0 8px var(--bg);margin-left:8px;margin-top:-2px;white-space:nowrap;pointer-events:none}

#rail{position:absolute;inset:0;z-index:900;pointer-events:none;display:flex;flex-direction:column;justify-content:flex-end}
.compare-dock{position:absolute;left:calc(10px + var(--sl));right:calc(10px + var(--sr));bottom:calc(12px + var(--sb));z-index:960;background:var(--sheet-9);border:1px solid var(--line);border-radius:var(--radius-card);padding:10px 12px;backdrop-filter:blur(12px);display:flex;align-items:flex-start;gap:8px;pointer-events:auto;flex-wrap:nowrap}
.dock-chips{flex:1 1 0;display:flex;flex-wrap:wrap;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;-webkit-overflow-scrolling:touch}
.dock-chips::-webkit-scrollbar{display:none;width:0;height:0}
.dock-chip,.dock-empty{flex-shrink:0;min-height:44px;min-width:44px;border-radius:12px;padding:6px 10px;display:flex;align-items:center;gap:6px;font-size:11px;border:1px solid var(--line);background:var(--white-04);color:var(--foam);white-space:nowrap}
.dock-chip button{border:0;background:transparent;color:var(--dim);cursor:pointer;min-width:32px;min-height:32px;font-size:14px}
.dock-empty{color:var(--muted);border-style:dashed}
.dock-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.go-compare,.clear-compare{border:0;cursor:pointer;font:600 11px/1 var(--font-body);border-radius:var(--radius-chip);padding:10px 11px;white-space:nowrap;flex-shrink:0;min-height:44px;min-width:44px}
.go-compare{background:var(--mint);color:var(--accent-ink)}
.go-compare:disabled{opacity:.35;cursor:default}
.clear-compare{background:transparent;color:var(--dim);padding:10px 6px}

.sheet{position:absolute;left:0;right:0;bottom:0;top:auto;z-index:900;background:var(--sheet);border-top:1px solid var(--line);border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;backdrop-filter:blur(16px);transform:translateY(110%);transition:transform .32s cubic-bezier(.2,.8,.2,1),height .32s cubic-bezier(.2,.8,.2,1),top .32s cubic-bezier(.2,.8,.2,1),border-radius .32s cubic-bezier(.2,.8,.2,1);height:64dvh;max-height:none;display:flex;flex-direction:column;min-width:0;box-shadow:0 -20px 60px var(--shadow);pointer-events:auto}
.sheet.open{transform:translateY(0)}
.sheet.snap-full{top:var(--st);bottom:0;height:auto;max-height:none;border-radius:0}
.sheet.dragging{transition:none}
.handle-hit{display:flex;align-items:center;justify-content:center;height:44px;min-height:44px;width:100%;flex-shrink:0;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.handle{width:42px;height:4px;border-radius:4px;background:var(--white-18);pointer-events:none}
.sheet-scroll{overflow-x:hidden;overflow-y:auto;padding:0 16px calc(var(--dock-h) + 24px + var(--sb));flex:1;min-height:0;min-width:0;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior:contain}
.sheet.snap-full .sheet-scroll{padding-bottom:calc(24px + var(--sb))}
.compare-dock.tucked{transform:translateY(calc(100% + 32px));pointer-events:none;z-index:800}
.sheet-scroll::-webkit-scrollbar{width:0;height:0;display:none}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px;touch-action:none;-webkit-user-select:none;user-select:none}
.sheet-head .x,.sheet-head .icon-btn{touch-action:manipulation}
.sheet-head h2{margin:0;font-family:var(--font-display);font-size:22px;letter-spacing:-.02em}
.meta{font-size:12px;color:var(--dim);margin-top:3px}
.x,.icon-btn{border:0;background:var(--white-06);color:var(--foam);width:44px;height:44px;border-radius:10px;cursor:pointer;font-size:16px;flex-shrink:0}
.price-card{background:linear-gradient(180deg,var(--accent-08),var(--white-03));border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:12px}
.price-card .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.price-card .v{font-size:26px;font-weight:700;letter-spacing:-.03em;margin-top:2px}
.price-card .v.unk{color:var(--muted);font-style:italic;font-weight:500;font-size:22px}
.rows{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.rows > div{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;column-gap:8px;row-gap:0;min-height:28px;font-size:12px;color:var(--dim)}
.rows > div > span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows > div > .chip{grid-column:2;margin:0;position:static;flex-shrink:0;align-self:center}
.rows b{grid-column:3;justify-self:end;color:var(--foam);font-weight:600;text-align:right;white-space:nowrap}
.hurr{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--danger-08);border:1px solid var(--danger-22);font-size:12px;margin-bottom:10px;color:var(--danger-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{font-size:10.5px;font-weight:600;letter-spacing:.03em;border-radius:var(--radius-chip);padding:5px 9px;border:1px solid transparent}
.chip.open{background:var(--mint-d);color:var(--mint);border-color:var(--accent-3)}
.chip.uc{background:var(--uc-12);color:var(--uc);border-color:var(--uc-3)}
.chip.complete{background:var(--warn-12);color:var(--sand);border-color:var(--warn-3)}
.chip.tender{background:var(--info-12);color:var(--tender);border-color:var(--info-3)}
.chip.rumor{background:var(--rumor-12);color:var(--rumor);border-color:var(--rumor-3)}
.chip.dispute{background:var(--uc-14);color:var(--uc);border-color:var(--uc-4)}
.chip.none{color:var(--muted);background:var(--white-03);border-color:var(--line);font-weight:500;letter-spacing:0}
.chip.primary{background:var(--coral-d);color:var(--coral);border-color:rgba(255,107,71,.35)}
.chip.priced{background:var(--mint-d);color:var(--mint);border-color:var(--accent-3)}
.chip.unknown{background:var(--white-04);color:var(--muted);border-color:var(--line)}
.chip.lock{background:var(--white-04);color:var(--dim);border-color:var(--line)}
.caption{font-size:10.5px;color:var(--muted);margin:0 0 12px;line-height:1.4}
.gates-bands{margin:0 0 12px}
.gates-bands .rows{margin-top:8px}
.actions{display:flex;gap:8px;margin-bottom:6px}
.actions button,.back-btn{flex:1;border:0;border-radius:12px;padding:11px;cursor:pointer;font:600 13px/1 var(--font-body);min-height:44px;min-width:44px}
.btn-a{background:var(--mint-d);color:var(--mint)}
.btn-ghost{background:var(--white-05);color:var(--dim)}
.legend{display:flex;flex-wrap:wrap;gap:8px 10px;margin:8px 0 12px;font-size:10px;color:var(--muted)}
.legend i{display:inline-block;width:7px;height:7px;border-radius:99px;margin-right:4px}
.map-credit{position:absolute;right:calc(12px + var(--sr));bottom:calc(var(--dock-h) + 16px + var(--sb));z-index:500;display:flex;align-items:center;height:16px;min-width:16px;min-height:16px;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--sheet-72);color:var(--muted);font:600 9px/16px var(--font-body);cursor:pointer}
.map-credit-i{width:16px;height:16px;display:grid;place-items:center;flex-shrink:0;font-style:italic;font-weight:700}
.map-credit-text{max-width:0;overflow:hidden;white-space:nowrap;opacity:0;padding-right:0;transition:max-width .2s ease,opacity .2s ease,padding .2s ease}
.map-credit.open .map-credit-text{max-width:88px;opacity:1;padding-right:7px}

.filters{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter-chip,.sort-chip{border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:var(--radius-chip);padding:10px 12px;font:600 11px/1 var(--font-body);cursor:pointer;min-height:44px;white-space:nowrap}
.filter-chip.on{background:var(--mint-d);color:var(--mint);border-color:var(--accent-3)}
.sort-chip.on{background:var(--sand-d);color:var(--sand);border-color:var(--warn-3)}
.sort-row{display:flex;gap:6px;margin-bottom:12px}

.rank-table{margin:0 0 12px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;-webkit-overflow-scrolling:touch;min-width:0}
.rank-table::-webkit-scrollbar{height:4px}
.rank-cagr-h,.rank-cagr,.rank-tier-h,.rank-tier{display:none}
.rank-table{width:100%;max-width:100%}
.rank-cols,.rank-row{display:grid;grid-template-columns:24px minmax(0,1fr) 54px 44px 40px;gap:4px 6px;align-items:center;min-width:0;width:100%}
.rank-head{font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:6px 2px 8px;padding-right:48px;border-bottom:1px solid var(--line);margin-bottom:0;min-width:0;box-sizing:border-box;width:100%}
.rank-head span{white-space:nowrap}
.rank-head span:last-child{letter-spacing:0}
.rank-line{display:flex;align-items:stretch;gap:4px;border-bottom:1px solid var(--line);min-width:0;width:100%}
.rank-line .icon-btn{align-self:center;flex-shrink:0;width:44px;height:44px}
.rank-row{padding:10px 2px;border-bottom:0;min-height:52px;cursor:pointer;flex:1 1 auto;width:auto;min-width:0;text-align:left;background:transparent;border-left:0;border-right:0;border-top:0;color:inherit;font:inherit}
.rank-vs{font-size:10.5px;text-align:right;white-space:nowrap;overflow:visible}
.rank-score{font-weight:700;font-size:13px;text-align:right;min-width:0;overflow:visible;white-space:nowrap;color:var(--green)}
.rank-usd{text-align:right;white-space:nowrap}
.rank-samples{flex-basis:100%;font-size:10px;font-weight:500;color:var(--dim);white-space:normal;line-height:1.3;margin-top:2px}
.tier-pip{display:inline-block;width:7px;height:7px;border-radius:99px;flex-shrink:0;background:var(--teal)}
.tier-pip.tier-primary{background:var(--coral)}
.tier-pip.tier-priced{background:var(--teal)}
.tier-pip.tier-unknown{background:var(--purple)}
.chip.tier-primary{background:var(--coral-d);color:var(--coral);border-color:rgba(255,107,71,.35)}
.chip.tier-secondary{background:var(--teal-d);color:var(--teal);border-color:rgba(74,157,156,.35)}
.chip.tier-watch{background:var(--purple-d);color:var(--purple);border-color:rgba(167,139,250,.35)}
.filter-chip[data-fil="primary"]{color:var(--coral);border-color:rgba(255,107,71,.35)}
.filter-chip[data-fil="primary"].on{background:var(--coral-d);color:var(--coral);border-color:rgba(255,107,71,.5)}
.filter-chip[data-fil="priced"]{color:var(--teal);border-color:rgba(74,157,156,.35)}
.filter-chip[data-fil="priced"].on{background:var(--teal-d);color:var(--teal);border-color:rgba(74,157,156,.5)}
.filter-chip[data-fil="unknown"]{color:var(--purple);border-color:rgba(167,139,250,.35)}
.filter-chip[data-fil="unknown"].on{background:var(--purple-d);color:var(--purple);border-color:rgba(167,139,250,.5)}
.scen-row,.proj-row{display:flex;flex-wrap:wrap;gap:6px;margin:0}
.proj-row{margin:0 0 10px}
.scen-chip,.proj-chip{border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:var(--radius-chip);padding:10px 12px;font:600 11px/1 var(--font-body);cursor:pointer;min-height:44px;white-space:nowrap}
.scen-chip[data-scen="conservative"]{color:var(--teal);border-color:rgba(74,157,156,.4)}
.scen-chip[data-scen="conservative"].on{background:var(--teal-d)}
.scen-chip[data-scen="base"]{color:var(--coral);border-color:rgba(255,107,71,.4)}
.scen-chip[data-scen="base"].on{background:var(--coral-d)}
.scen-chip[data-scen="abundance"]{color:var(--gold);border-color:rgba(255,209,102,.4)}
.scen-chip[data-scen="abundance"].on{background:var(--gold-d)}
.scen-chip[data-scen="custom"]{color:var(--purple);border-color:rgba(167,139,250,.4)}
.scen-chip[data-scen="custom"].on{background:var(--purple-d)}
.proj-chip.on{background:var(--white-06);color:var(--foam);border-color:var(--line)}

        <div class="handle"></div>
      </div>
      <div class="sheet-scroll" id="sheetBody"></div>
    </div>
    <div class="define-layer" id="defineLayer" hidden></div>
    <div class="compare-dock" id="dock"></div>
  </div>
  <div class="modal" id="modal" hidden></div>
  <div class="toast" id="toast" hidden></div>
</div>
<script>
(function () {
  const BRAND = { name: "Coastal Grade", short: "COASTAL GRADE", title: "Coastal Grade \u00b7 PVR" };
  const PLAN_KEY = "coastalgrade.view";
  const UNIT_KEY = "coastalgrade.unit";
  const RAIL_KEY = "coastalgrade.rail";
  const M2_IN_FT2 = 10.7639104167;  // 1 m² = this many ft²
  const FREE = ["bucerias", "nuevo-vallarta", "sayulita", "punta-mita", "conchas-chinas"];
  const SHORT = {
    "pv-5dedic": "5 de Dic",
    "boca": "Boca",
    "la-cruz": "La Cruz",
    "cabo-medano": "Cabo Médano",
    "el-anclote": "El Anclote",
    "punta-mita-inside": "Inside"
  };
  const STAGE_CHIP = {
    open: "open",
    complete_not_open: "complete",
    under_construction: "uc",
    rumor: "rumor",
    tender: "tender"
  };
  const STAGE_LABEL = {
    open: "OPEN / priced-in",
    complete_not_open: "COMPLETE / NOT OPEN",
    under_construction: "UNDER CONSTRUCTION",
    rumor: "RUMOR",
    tender: "TENDER"
  };

  const preview = new URLSearchParams(location.search).get("preview") === "1"
    || localStorage.getItem("cg_owner_preview") === "1";

  function readStoredPlan() {
    try {
      const v = localStorage.getItem(PLAN_KEY);
      if (v === "light" || v === "pro") return v;
    } catch (e) {}
    return "pro";
  }

  function readStoredUnit() {
    try {
      const v = localStorage.getItem(UNIT_KEY);
      if (v === "m2" || v === "ft2") return v;
    } catch (e) {}
    return "m2";
  }

  const state = {
    minutes: 90,
    selected: null,
    compare: [],
    view: "map",
    plan: readStoredPlan(),
    unit: readStoredUnit(),
    listFilter: "all",
    listSort: "score",
    comingFilter: "all",
    proId: null,
    horizon: 5,
    cmpYears: 5,
    growthR: 0.12,
    playYear: 2026,
    scenOn: { conservative: true, base: true, abundance: true, custom: true }
  };

  let DATASET = null;
  let TOWNS = [];
  let CABO = null;
  let CC = null;
  let CATALOG = {};
  let HURR_REGION = null;
  let PIPELINE = [];
  let SCORES = {};
  let SCORES_META = null;
  let SERIES = {};
  let GATES = null;
  let HOMES = null;
  let ANCLOTE = null;
  const NOW_YEAR = 2026;
  /* assumption rates: Conservative 4% / Base 8% / Abundance 12% — not JSX seeds or CAGRs */
  const R_CONSERVATIVE = 0.07;
  const R_BASE = 0.10;
  const R_ABUNDANCE = 0.14;
  const PEER_BAR_IDS = ["cabo-medano", "conchas-chinas", "sayulita", "punta-mita"];
  const OVERLAY_TOKENS = ["--accent", "--coral", "--gold", "--purple"];
  const OVERLAY_FALLBACK = ["#3eebc9", "#FF6B47", "#FFD166", "#A78BFA"];
  let markers = {};
  let map, radius;

  document.title = BRAND.title;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }

  function isDesktop() {
    return window.matchMedia("(min-width: 900px)").matches;
  }

  function getPlan() {
    if (preview) return "pro";
    return state.plan === "light" ? "light" : "pro";
  }

  function setPlan(plan) {
    const next = plan === "light" ? "light" : "pro";
    state.plan = next;
    try { localStorage.setItem(PLAN_KEY, next); } catch (e) {}
    if (next === "light") {
      state.compare = state.compare.filter(function (id) { return unlocked(id); });
      if (state.selected && !unlocked(state.selected)) {
        openView("map");
      }
    }
    refreshMarkers();
    paintDock();
    const sheet = document.getElementById("sheet");
    if (sheet && sheet.classList.contains("open")) paintSheet();
    updateSettingsChips();
  }

  function getUnit() {
    return state.unit === "ft2" ? "ft2" : "m2";
  }

  function setUnit(unit) {
    const next = unit === "ft2" ? "ft2" : "m2";
    state.unit = next;
    try { localStorage.setItem(UNIT_KEY, next); } catch (e) {}
    updateTopbarSubtitle();
    const sheet = document.getElementById("sheet");
    if (sheet) paintSheet();
    if (document.getElementById("priceChart")) renderPriceChart();
    updateSettingsChips();
  }

  function unlocked(id) {
    if (preview || getPlan() === "pro") return !!town(id);
    if (id === "punta-mita-inside" || id === "el-anclote") return FREE.indexOf("punta-mita") !== -1;
    return FREE.indexOf(id) !== -1;
  }

  function updateSettingsChips() {
    const modal = document.getElementById("modal");
    if (!modal || modal.hidden) return;
    const plan = getPlan();
    modal.querySelectorAll("[data-plan]").forEach(function (b) {
      b.classList.toggle("on", b.getAttribute("data-plan") === plan);
    });
    const unit = getUnit();
    modal.querySelectorAll("[data-unit]").forEach(function (b) {
      b.classList.toggle("on", b.getAttribute("data-unit") === unit);
    });
  }

  function bindSettingsChips() {
    const modal = document.getElementById("modal");
    if (!modal) return;
    modal.querySelectorAll("[data-plan]").forEach(function (b) {
      b.onclick = function () { setPlan(b.getAttribute("data-plan")); };
    });
    modal.querySelectorAll("[data-unit]").forEach(function (b) {
      b.onclick = function () { setUnit(b.getAttribute("data-unit")); };
    });
  }

  function updateTopbarSubtitle() {
    const sub = document.querySelector(".brand .sub");
    if (sub) sub.textContent = "PVR center · Homia asking " + unitLabel();
  }

  function brandColor(token) {
    return getComputedStyle(document.documentElement).getPropertyValue(token).trim();
  }

  function withAlpha(color, a) {
    const c = (color || "").trim();
    const hex = /^#?([0-9a-fA-F]{6})$/.exec(c);
    if (hex) {
      const n = parseInt(hex[1], 16);
      return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
    }
    const rgb = /^rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/i.exec(c);
    if (rgb) return "rgba(" + rgb[1] + "," + rgb[2] + "," + rgb[3] + "," + a + ")";
    return c;
  }

  function overlayColor(i) {
    const stroke = brandColor(OVERLAY_TOKENS[i % 4]) || OVERLAY_FALLBACK[i % 4];
    return { stroke: stroke, fill: withAlpha(stroke, 0.22) };
  }

  function overlayVar(i) {
    return "var(" + OVERLAY_TOKENS[i % 4] + ")";
  }

  function scoreRowById(id) {
    return id && SCORES[id] ? SCORES[id] : null;
  }

  function scoreRow(t) {
    if (t == null) return null;
    if (typeof t === "string") return scoreRowById(t);
    return scoreRowById(t.id);
  }

  function hasHomiaHeadline(row) {
    return !!(row && row.usd_m2 && row.usd_m2.headline != null);
  }

  function overallOfRow(row) {
    if (!row || !row.composite || row.composite.overall == null) return null;
    if (row.id === "punta-mita" || row.id === "punta-mita-inside") return null;
    if (!hasHomiaHeadline(row)) return null;
    return row.composite.overall;
  }

  function scoreOf(t) {
    return overallOfRow(scoreRow(t));
  }

  function fileRankOf(t) {
    const row = scoreRow(t);
    if (!row || row.rank == null) return null;
    const n = Number(row.rank);
    return isFinite(n) ? n : null;
  }

  function isRankedTown(t) {
    if (!t || t.id === "punta-mita" || t.id === "punta-mita-inside") return false;
    const row = scoreRow(t);
    if (row && row.rank != null) return true;
    const ids = (SCORES_META && SCORES_META.ranked_markets) || [];
    return ids.indexOf(t.id) !== -1;
  }

  function isCompleteRow(row) {
    if (!row || !row.composite) return false;
    return !!(row.composite.complete || row.composite.axes_scored === 7);
  }

  function axesScoredOf(row) {
    if (!row || !row.composite || row.composite.axes_scored == null) return 0;
    return row.composite.axes_scored;
  }

  function fmtAxis(n) {
    if (n == null || n !== n) return null;
    return Number(n).toFixed(1);
  }

  function fmtOverall(n) {
    if (n == null || n !== n) return null;
    return String(Math.round(Number(n)));
  }

  function axisScore(row, key) {
    const a = row && row.axes && row.axes[key];
    if (!a || a.status !== "scored") return null;
    const v = a.score_0_10;
    if (v == null) return null;
    const n = Number(v);
    return isFinite(n) ? n : null;
  }

  function completenessChip(row) {
    if (!row || !row.composite) return "";
    if (isCompleteRow(row)) return '<span class="chip priced">7 of 7</span>';
    const n = axesScoredOf(row);
    return '<span class="chip partial">Partial \u00b7 ' + n + " of 7</span>";
  }

  function gradeHeading(row) {
    if (isCompleteRow(row)) return "Coastal Grade \u00b7 7 of 7";
    return "Partial grade \u00b7 " + axesScoredOf(row) + " of 7";
  }

  function coverageCaption(row) {
    if (!row || !row.composite) {
      return "Unknown axes dropped, not zeroed. Prefer UNKNOWN over a guessed town delta.";
    }
    if (isCompleteRow(row)) return "7 of 7 axes scored.";
    const unk = row.composite.unknown_axes || [];
    const names = unk.map(function (k) {
      const ax = RADAR_AXES.find(function (a) { return a.key === k; });
      return ax ? ax.label : k;
    });
    const n = axesScoredOf(row);
    return "Partial \u00b7 " + n + " of 7. " +
      (names.length ? names.join(" \u00b7 ") + " unknown \u2014 dropped, not zeroed. " : "") +
      "Prefer UNKNOWN over a guessed town delta.";
  }

  function spiderLabel(id, row) {
    if (id === "punta-mita-inside") return "Inside";
    if (id === "el-anclote") return "El Anclote";
    if (id === "punta-mita") return "Punta Mita mixed";
    const t = town(id);
    if (t) return shortName(t);
    return (row && row.name) || id;
  }

  function expandSpiderIds(ids) {
    const out = [];
    const seen = {};
    function push(id) {
      if (!id || seen[id] || id === "punta-mita") return;
      seen[id] = true;
      out.push(id);
    }
    (ids || []).forEach(function (id) {
      if (id === "punta-mita") {
        push("punta-mita-inside");
        push("el-anclote");
      } else {
        push(id);
      }
    });
    return out;
  }

  function shortName(t) {
    return SHORT[t.id] || t.name;
  }

  function headlineOf(t) {
    if (t && t.usd_m2 && t.usd_m2.headline != null) return t.usd_m2.headline;
    return null;
  }

  function tierOf(t) {
    const h = headlineOf(t);
    if (h != null && (t.peer || t.off_map)) return "primary";
    if (h != null) return "priced";
    return "unknown";
  }

  function storyTier(t) {
    const k = tierOf(t);
    if (k === "primary") return { id: "primary", label: "PRIMARY" };
    if (k === "priced") return { id: "secondary", label: "SECONDARY" };
    return { id: "watch", label: "WATCH" };
  }

  function tierChipHtml(t) {
    const st = storyTier(t);
    return '<span class="chip tier-' + st.id + '">' + st.label + "</span>";
  }

  function cagrOf(t) {
    if (!t) return null;
    const e = seriesEntry(t.id);
    return e && e.cagr != null && isFinite(e.cagr) ? e.cagr : null;
  }

  function fmtCagr(r) {
    if (r == null || !isFinite(r)) return "\u2014";
    const pct = r * 100;
    const sign = pct < 0 ? "\u2212" : "";
    return sign + Math.abs(pct).toFixed(1) + "%";
  }

  function fmtRank(n) {
    const v = Number(n);
    if (!isFinite(v) || v < 1) return "\u2014";
    return v < 10 ? "0" + v : String(v);
  }

  function pctLabel(r) {
    const pct = Number(r) * 100;
    if (!isFinite(pct)) return "\u2014";
    return pct.toFixed(1) + "%";
  }

  function toDisplay(usd_m2) {
    if (usd_m2 == null) return null;
    return getUnit() === "ft2" ? usd_m2 / M2_IN_FT2 : usd_m2;
  }

  function unitLabel() { return getUnit() === "ft2" ? "USD/ft\u00b2" : "USD/m\u00b2"; }

  function fmtUsd(n) {
    if (n == null) return "unknown";
    if (n >= 100) return "$" + Math.round(n).toLocaleString("en-US");
    return "$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  }

  function vsFmt(a, b) {
    if (a == null || b == null) return { text: "—", cls: "" };
    const da = toDisplay(a);
    const db = toDisplay(b);
    if (da == null || db == null) return { text: "—", cls: "" };
    const raw = da - db;
    const shown = Math.abs(raw) >= 100 ? Math.round(raw) : Math.round(raw * 10) / 10;
    if (shown === 0) return { text: "0", cls: "" };
    const pct = Math.round((raw / db) * 100);
    const sign = raw > 0 ? "+" : "\u2212";
    const abs = Math.abs(shown);
    const money = Math.abs(raw) >= 100
      ? Math.round(abs).toLocaleString("en-US")
      : abs.toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    return {
      text: sign + "$" + money + " · " + sign + Math.abs(pct) + "%",
      cls: raw > 0 ? "pos" : "neg"
    };
  }

  function vsPctFmt(a, b) {
    if (a == null || b == null) return { text: "\u2014", cls: "" };
    const da = toDisplay(a);
    const db = toDisplay(b);
    if (da == null || db == null || !db) return { text: "\u2014", cls: "" };
    const raw = da - db;
    const pct = Math.round((raw / db) * 100);
    if (pct === 0) return { text: "0%", cls: "" };
    const sign = pct > 0 ? "+" : "\u2212";
    return { text: sign + Math.abs(pct) + "%", cls: raw > 0 ? "pos" : "neg" };
  }

  function driveLabel(t) {
    const d = t.drive_min_to_pvr || {};
    if (t.off_map || d.basis === "off_map") return d.label || "off-map";
    if (d.basis === "boat" || t.access === "boat") return d.label || "BOAT";
    if (d.basis === "in_pv" || t.access === "in_pv") return d.label || "in PV";
    if (d.low == null && d.high == null) return "unknown";
    if (d.low === d.high) return "~" + d.low + " min est.";
    return "~" + d.low + "\u2013" + d.high + " min est.";
  }

  function driveKey(t) {
    const d = t.drive_min_to_pvr || {};
    if (d.basis === "in_pv" || t.access === "in_pv") return 0;
    if (d.basis === "boat" || t.access === "boat") return 1000;
    if (t.off_map || d.basis === "off_map") return 2000;
    if (d.low == null) return 900;
    return d.low;
  }

  function typicalMin(t) {
    const d = t.drive_min_to_pvr || {};
    if (d.basis === "boat" || t.access === "boat") return 70;
    if (d.basis === "in_pv" || t.access === "in_pv") return 12;
    if (d.low == null) return 90;
    if (d.high == null) return d.low;
    return Math.round((d.low + d.high) / 2);
  }

  function inRadius(t) {
    if (t.off_map) return false;
    const d = t.drive_min_to_pvr || {};
    if (d.basis === "boat" || t.access === "boat") return state.minutes >= 60;
    if (d.basis === "in_pv" || t.access === "in_pv") return true;
    if (d.low == null) return true;
    if (state.minutes >= 120) return d.low <= 150;
    return d.low <= state.minutes;
  }

  function stubTownFromScore(id) {
    const row = scoreRow(id);
    if (!row) return null;
    return {
      id: row.id,
      name: row.name || id,
      usd_m2: row.usd_m2 || null,
      peer: !!row.peer,
      off_map: false,
      rank_only: true,
      catalysts: [],
      hurricane: { note: null }
    };
  }

  function town(id) {
    if (!id) return null;
    if (CABO && CABO.id === id) return CABO;
    if (ANCLOTE && ANCLOTE.id === id) return ANCLOTE;
    const found = TOWNS.find(function (t) { return t.id === id; });
    if (found) return found;
    return stubTownFromScore(id);
  }

  function allPlaces() {
    const list = CABO ? TOWNS.concat([CABO]) : TOWNS.slice();
    if (ANCLOTE) {
      const i = list.findIndex(function (t) { return t.id === "punta-mita"; });
      if (i >= 0) list.splice(i + 1, 0, ANCLOTE);
      else list.push(ANCLOTE);
    }
    return list;
  }

  function buildAnclote() {
    const row = scoreRowById("el-anclote");
    if (!row) { ANCLOTE = null; return; }
    const pm = TOWNS.find(function (t) { return t.id === "punta-mita"; });
    ANCLOTE = {
      id: "el-anclote",
      name: "El Anclote",
      usd_m2: row.usd_m2 || null,
      peer: false,
      off_map: false,
      rank_only: true,
      catalysts: [],
      hurricane: (pm && pm.hurricane) || { note: null },
      drive_min_to_pvr: (pm && pm.drive_min_to_pvr) || { low: 40, high: 50, basis: "estimated" },
      access: pm && pm.access
    };
  }

  function catalystObjs(t) {
    return (t.catalysts || []).map(function (id) {
      const c = CATALOG[id];
      if (!c) return { id: id, label: id, stage: "none", priced_in: false, meta: "" };
      return { id: id, label: c.label, stage: c.stage, priced_in: !!c.priced_in, meta: c.meta || "" };
    });
  }

  function chipHtml(c) {
    const klass = STAGE_CHIP[c.stage] || "none";
    return '<span class="chip ' + klass + '">' + esc(c.label) + (c.meta ? " · " + esc(c.meta) : "") + "</span>";
  }


  const AXES = {
    access: {
      name: "ACCESS",
      mean: "Drive time to PVR.",
      grade: [
        "Gate is about 2 hours of an international airport.",
        "Shorter drive scores higher.",
        "Times in the file are estimates."
      ]
    },
    signal: {
      name: "SIGNAL",
      mean: "Do we have a verified asking USD/m\u00b2 (Homia MLS / Inmuebles24).",
      grade: [
        "This is data quality, not a vibe score.",
        "No headline price = no score."
      ]
    },
    storm: {
      name: "STORM",
      mean: "Hurricane history and damage, not a hurricane-free badge.",
      grade: [
        "The 46-storm NOAA count is PV-centered (60 nmi) and is not stamped on every town.",
        "Town note only when one exists (e.g. Lidia / Tomatl\u00e1n)."
      ]
    },
    catalyst: {
      name: "CATALYST",
      mean: "Future upside only.",
      grade: [
        "Stages: rumor \u2192 tender \u2192 under construction \u2192 complete-not-open \u2192 open.",
        "Open is priced-in and does not count as future upside."
      ]
    },
    comps: {
      name: "RUNWAY (COMPS)",
      mean: "Price runway vs peers: Puerto Vallarta, Sayulita, Punta Mita, Cabo M\u00e9dano.",
      grade: [
        "How cheap or expensive this town is per m\u00b2 versus those markets.",
        "No verified USD/m\u00b2 = no Runway score.",
        "AMPI averages are not comps."
      ]
    },
    safety: {
      name: "SAFETY",
      mean: "Town-level safety. Not a tourist-board badge.",
      grade: [
        "No verified per-town crime or safety series is on file.",
        "Unknown stays unknown. Do not invent a safety score from regional headlines."
      ]
    },
    water: {
      name: "WATER",
      mean: "Potable water at the town, not a regional stamp.",
      grade: [
        "No verified per-town potable-water measure is on file.",
        "Unknown stays unknown."
      ]
    },
    beach: {
      name: "BEACH",
      mean: "Beach quality and sargassum.",
      grade: [
        "Pacific is usually lighter on sargassum than the Caribbean; still grade the beach, never a free badge.",
        "No town-level sargassum count is on file. Unknown stays unknown."
      ]
    },
    timezone: {
      name: "TIMEZONE",
      mean: "Overlap with San Francisco, New York, and Miami (within 3 hours).",
      grade: [
        "Hard gate: timezone within 3h of SF / NY / Miami.",
        "Scored towns on this map are MST or CST. Do not invent an IANA split."
      ]
    }
  };

  const METRICS = {
    usd: {
      name: "Asking USD/m\u00b2",
      mean: "What sellers are asking per square meter of built space, in US dollars, right now. Not a sold price.",
      grade: [
        "This is what sellers are asking per square meter of built space, in US dollars, right now.",
        "It is not a sold price. Unknown stays unknown."
      ]
    },
    source: {
      name: "Source",
      mean: "Which listing feed the number came from. Homia MLS is the tourist-condo feed we trust for Aug 2026.",
      grade: [
        "Source names the listing feed the number came from.",
        "Homia MLS is the tourist-condo feed we trust for Aug 2026."
      ]
    },
    n: {
      name: "n",
      mean: "How many listings went into that number. Sayulita n=53 means 53 listings, not 53 towns. Bigger n is more trustworthy. No n = we only have a headline, not a sample.",
      grade: [
        "n is how many listings went into the number — not how many towns.",
        "Bigger n is more trustworthy. No n means we only have a headline, not a sample."
      ]
    },
    drive: {
      name: "Drive to PVR",
      mean: "Estimated minutes to Puerto Vallarta airport. Not a live GPS drive.",
      grade: [
        "These are estimated minutes to Puerto Vallarta airport.",
        "Not a live GPS drive."
      ]
    },
    catalysts: {
      name: "Catalysts",
      mean: "A road, hotel, or bridge that can move prices. Open is already priced in and is not future upside.",
      grade: [
        "A catalyst is a road, hotel, or bridge that can move prices.",
        "Open is already priced in and is not future upside."
      ]
    },
    vscc: {
      name: "vs Conchas Chinas",
      mean: "Cheaper or more expensive than Conchas Chinas (the expensive PV beach peer). Negative % means cheaper.",
      grade: [
        "Cheaper or more expensive than Conchas Chinas, the expensive PV beach peer.",
        "A negative percent means cheaper."
      ]
    },
    score: {
      name: "Score",
      mean: "Coastal Grade overall is 0–100 from seven 0–10 arms. Unknown arms are dropped, not zeroed. A known empty catalyst catalog scores 0.",
      grade: [
        "Overall is an integer 0–100. Arms display to one decimal on a 0–10 scale.",
        "7 of 7 towns use all seven weights. Partial grades drop unknown arms and renormalize. Prefer UNKNOWN over a guessed town water or hurricane delta.",
        "Punta Mita mixed 5196 is the peer pin only — not one gated-split market. Overlay inside + El Anclote."
      ]
    }
  };

  function catalystDate(meta) {
    if (!meta) return null;
    const s = String(meta);
    const seasonal = s.match(/\b((?:early|mid|late|winter|spring|summer|fall|autumn)\s+20\d{2})\b/i);
    if (seasonal) return seasonal[1];
    const dmy = s.match(/\b(\d{1,2}\/\d{1,2}\/\d{2,4})\b/);
    if (dmy) return dmy[1];
    const rangeMon = s.match(/\b(\d{1,2}[\u2013\-]\d{1,2}\s+(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\.?\s+20\d{2})\b/i);
    if (rangeMon) return rangeMon[1];
    const mon = s.match(/\b((?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\.?\s+20\d{2})\b/i);
    if (mon) return mon[1];
    return null;
  }

  function thisAccess(t) {
    const d = t.drive_min_to_pvr || {};
    if (d.basis === "boat" || t.access === "boat") return (d.label || "BOAT") + " \u00b7 boat";
    if (d.basis === "in_pv" || t.access === "in_pv") return (d.label || "in PV") + " \u00b7 in PV";
    if (d.basis === "off_map" || t.access === "off_map") return "off-map";
    if (d.low == null && d.high == null) return "unknown \u2014 not invented";
    return driveLabel(t) + " \u00b7 " + (d.basis || "estimated");
  }

  function thisSignal(t) {
    const u = t.usd_m2;
    if (!u || u.headline == null) return "unknown \u2014 not invented";
    let s = fmtUsd(toDisplay(u.headline)) + " " + unitLabel();
    if (u.source) s += " \u00b7 " + u.source;
    if (u.n != null) s += " \u00b7 n=" + u.n;
    return s;
  }

  function thisStorm(t) {
    const why = axisWhy(t, "hurricane_history_and_damage");
    if (why && why !== "unknown \u2014 not invented") return why;
    if (t && t.hurricane && t.hurricane.note) return t.hurricane.note;
    return "unknown \u2014 not invented";
  }

  function thisCatalyst(t) {
    const cats = catalystObjs(t);
    if (!cats.length) return "Nothing new on file.";
    const bits = cats.map(function (c) {
      return c.label + " \u00b7 " + (STAGE_LABEL[c.stage] || c.stage);
    });
    const future = cats.filter(function (c) {
      return c.stage !== "open" && !c.priced_in;
    });
    if (!future.length) {
      return bits.join(". ") + " Open is priced-in and does not count as future upside.";
    }
    return bits.join(". ");
  }

  function thisComps(t) {
    const h = headlineOf(t);
    if (h == null) return "unknown \u2014 not invented";
    const vscc = vsFmt(h, headlineOf(CC));
    const vscb = vsFmt(h, headlineOf(CABO));
    return "vs Conchas Chinas " + vscc.text + ". vs Cabo M\u00e9dano " + vscb.text + ".";
  }

  function thisBeach(t) {
    const band = t.usd_m2 && t.usd_m2.band;
    if (band && /beach|lower/i.test(String(band))) return String(band);
    return axisWhy(t, "beach_sargassum");
  }

  function axisWhy(t, key) {
    const row = scoreRow(t);
    const a = row && row.axes && row.axes[key];
    if (a && a.why) return a.why;
    return "unknown \u2014 not invented";
  }

  function thisTownLine(id, t) {
    if (!t) return "";
    if (id === "access" || id === "drive") return thisAccess(t);
    if (id === "signal") return thisSignal(t);
    if (id === "storm") return thisStorm(t);
    if (id === "catalyst" || id === "catalysts") return thisCatalyst(t);
    if (id === "comps" || id === "vscc") return thisComps(t);
    if (id === "safety") return axisWhy(t, "safety");
    if (id === "water") return axisWhy(t, "potable_water");
    if (id === "beach") return thisBeach(t);
    if (id === "timezone") return axisWhy(t, "timezone_overlap");
    if (id === "usd") {
      const h = headlineOf(t);
      return h == null ? "unknown \u2014 not invented" : fmtUsd(toDisplay(h)) + " " + unitLabel();
    }
    if (id === "source") {
      if (t.usd_m2 && t.usd_m2.source) return t.usd_m2.source;
      return "unknown \u2014 not invented";
    }
    if (id === "n") {
      if (t.usd_m2 && t.usd_m2.n != null) return String(t.usd_m2.n);
      return "\u2014";
    }
    if (id === "score") {
      const row = scoreRow(t);
      if (t.id === "punta-mita") {
        const inside = scoreRow("punta-mita-inside");
        const out = scoreRow("el-anclote");
        const outOv = overallOfRow(out);
        const inN = axesScoredOf(inside);
        const outN = axesScoredOf(out);
        const inChip = isCompleteRow(inside) ? "7 of 7" : ("Partial \u00b7 " + inN + " of 7");
        const outChip = isCompleteRow(out) ? "7 of 7" : ("Partial \u00b7 " + outN + " of 7");
        const outLab = outOv == null ? "" : (fmtOverall(outOv) + " ");
        return "Peer pin 5196 \u2014 not a ranked market. Overlay inside \u00b7 " + inChip + " (no overall \u2014 no Homia headline) + El Anclote " + outLab + "(" + outChip + "). Hacienda 12589 n=3 and Las Terrazas 5992 n=2 are samples, not averaged.";
      }
      const ov = overallOfRow(row);
      if (ov == null) return "\u2014";
      if (isCompleteRow(row)) return fmtOverall(ov) + " \u00b7 7 of 7";
      return fmtOverall(ov) + " \u00b7 Partial \u00b7 " + axesScoredOf(row) + " of 7";
    }
    return "unknown \u2014 not invented";
  }

  function spiderCaption(ids, series) {
    const hasPm = (ids || []).indexOf("punta-mita") !== -1
      || (ids || []).indexOf("punta-mita-inside") !== -1
      || (ids || []).indexOf("el-anclote") !== -1
      || (series || []).some(function (s) { return s.id === "punta-mita-inside" || s.id === "el-anclote"; });
    if (hasPm) {
      function bit(id) {
        const srow = (series || []).filter(function (x) { return x.id === id; })[0];
        const row = srow ? srow.row : scoreRow(id);
        if (!row || !row.composite) return null;
        const ov = overallOfRow(row);
        const cov = isCompleteRow(row) ? "7 of 7" : ("Partial \u00b7 " + axesScoredOf(row) + " of 7");
        if (ov == null) return spiderLabel(id, row) + " \u00b7 " + cov;
        return spiderLabel(id, row) + " " + fmtOverall(ov) + " \u00b7 " + cov;
      }
      const parts = [bit("punta-mita-inside"), bit("el-anclote")].filter(Boolean);
      return "Mixed 5196 is the peer pin, not a gated-split market. Overlay: " +
        parts.join(" + ") + ". Unknown arms are not plotted at 0.";
    }
    const row = series && series[0] && series[0].row;
    return coverageCaption(row);
  }

  function spiderSeriesFromIds(ids) {
    const expanded = expandSpiderIds(ids);
    const series = [];
    expanded.forEach(function (id, i) {
      const row = scoreRow(id);
      if (!row || !row.axes) return;
      series.push({
        id: id,
        row: row,
        label: spiderLabel(id, row),
        color: overlayColor(i),
        values: RADAR_AXES.map(function (ax) { return axisScore(row, ax.key); }),
        complete: isCompleteRow(row)
      });
    });
    return series;
  }

  function partialGradeHtml(t) {
    if (!t) return '<p class="spider-empty">no spider \u2014 unknown ' + unitLabel() + "</p>";
    if (t.id === "punta-mita") return overlaySpiderHtml(["punta-mita"], { cmp: false, title: "Inside vs El Anclote", small: true });
    const series = spiderSeriesFromIds([t.id]);
    if (!series.length) return '<p class="spider-empty">no spider \u2014 unknown ' + unitLabel() + "</p>";
    const row = series[0].row;

    return '<div class="spider-block"><div class="group-h">' + head + "</div>" +
      '<div class="partial-head"><button type="button" class="score-tap" data-metric="score" aria-haspopup="dialog">' +

      completenessChip(row) + "</button></div>" +
      '<div class="chart-wrap chart-wrap-sm"><div id="radar" class="radar-mount" role="img" aria-label="Coastal Grade radar"></div><div class="radar-hits" id="radarHits"></div></div>' +
      '<p class="caption">' + esc(spiderCaption([t.id], series)) + "</p></div>";

  function overlaySpiderHtml(ids, opts) {
    opts = opts || {};
    const series = spiderSeriesFromIds(ids);
    if (!series.length) {
      return '<p class="spider-empty">no spider \u2014 unknown ' + unitLabel() + "</p>";
    }
    const title = opts.title || (series.length > 1 ? "Overlay grade" : gradeHeading(series[0].row));
    let html = '<div class="spider-block"><div class="group-h">' + esc(title) + "</div>";
    if (series.length > 1) {
      html += '<div class="radar-legend">';
      series.forEach(function (s, i) {
        const ov = overallOfRow(s.row);
        html += '<span><i style="background:' + overlayVar(i) + '"></i>' + esc(s.label) +
          (ov == null ? " \u00b7 " : (" " + fmtOverall(ov) + " ")) + completenessChip(s.row) + "</span>";
      });
      html += "</div>";
    }
    const wrapCls = opts.small ? "chart-wrap chart-wrap-sm" : ((opts.cmp !== false && series.length > 1) ? "chart-wrap chart-wrap-cmp" : "chart-wrap");
    html += '<div class="' + wrapCls + '"><div id="radar" class="radar-mount" role="img" aria-label="Coastal Grade radar"></div><div class="radar-hits" id="radarHits"></div></div>';
    html += '<p class="caption">' + esc(spiderCaption(ids, series)) + "</p></div>";
    return html;
  }

  function headlineRecord(id) {
    if (id === "el-anclote") {
      const row = scoreRowById("el-anclote");
      const h = row && row.usd_m2 && row.usd_m2.headline;
      if (h == null) return null;
      return { id: id, name: "El Anclote", headline: h };
    }
    const t = town(id);
    if (!t || headlineOf(t) == null) return null;
    const name = id === "punta-mita" ? "Punta Mita mixed" : shortName(t);
    return { id: id, name: name, headline: headlineOf(t) };
  }

  function peerPriceBarsHtml(compareIds) {
    compareIds = compareIds || [];
    const overlayingAnclote = compareIds.indexOf("punta-mita") !== -1 || compareIds.indexOf("el-anclote") !== -1;
    const seen = {};
    const rows = [];
    function pushId(id) {
      if (!id || seen[id]) return;
      const rec = headlineRecord(id);
      if (!rec) return;
      seen[id] = true;
      rows.push(rec);
    }
    PEER_BAR_IDS.forEach(pushId);
    compareIds.forEach(function (id) {
      if (id === "punta-mita") return; // mixed already in peer pins
      pushId(id);
    });
    if (overlayingAnclote) pushId("el-anclote");
    if (!rows.length) return "";
    let max = 0;
    rows.forEach(function (r) { if (r.headline > max) max = r.headline; });
    const warnC = brandColor("--warn") || "#e6c878";
    let html = '<div class="peer-bars"><div class="group-h">PEER PRICE BARS</div>';
    rows.forEach(function (r) {
      const cmpIdx = compareIds.indexOf(r.id);
      const compared = cmpIdx !== -1 || (r.id === "el-anclote" && overlayingAnclote);
      let color = compared ? overlayColor(Math.max(0, cmpIdx) % 4).stroke : warnC;
      if (r.id === "el-anclote") {
        const seriesIds = expandSpiderIds(compareIds);
        const ai = seriesIds.indexOf("el-anclote");
        if (ai >= 0) color = overlayColor(ai).stroke;
      }
      const pct = max > 0 ? Math.max(0, Math.min(100, (r.headline / max) * 100)) : 0;
      html += '<div class="peer-bar-row' + (compared ? " on" : "") + '">';
      html += '<div class="peer-bar-name">' + esc(r.name) + "</div>";
      html += '<div class="peer-bar-track"><span class="peer-bar-fill" style="width:' + pct.toFixed(1) + "%;background:" + color + '"></span></div>';
      html += '<div class="peer-bar-val">' + esc(fmtUsd(toDisplay(r.headline))) + "</div>";
      html += "</div>";
    });
    html += "</div>";
    return html;
  }

  function projPrice(headline, r, year) {
    return headline * Math.pow(1 + r, year - NOW_YEAR); // P(y) = headline * (1+r)^(y-2026)
  }

  function seriesEntry(townId) {
    const raw = SERIES && SERIES[townId];
    if (!raw) return { points: [], cagr: null };
    let points = [];
    let cagr = null;
    if (Array.isArray(raw)) {
      points = raw;
    } else if (typeof raw === "object") {
      points = raw.history || raw.points || raw.series || raw.years || [];
      if (raw.verified_cagr5 != null) cagr = Number(raw.verified_cagr5);
    }
    const out = [];
    (points || []).forEach(function (pt) {
      if (pt == null) return;
      const year = pt.year != null ? Number(pt.year) : (pt.y != null ? Number(pt.y) : NaN);
      const usd = pt.usd_m2 != null ? Number(pt.usd_m2) : (pt.usd != null ? Number(pt.usd) : (pt.price != null ? Number(pt.price) : NaN));
      if (!isFinite(year) || !isFinite(usd)) return;
      out.push({ year: year, usd_m2: usd });
    });
    out.sort(function (a, b) { return a.year - b.year; });
    if (isFinite(cagr) && Math.abs(cagr) > 1) cagr = cagr / 100;
    return { points: out, cagr: isFinite(cagr) ? cagr : null };
  }

  function verifiedPoints(t) {
    const h = headlineOf(t);
    if (h == null) return [];
    const entry = seriesEntry(t.id);
    const pts = entry.points.slice();
    const hasNow = pts.some(function (pt) { return pt.year === NOW_YEAR; });
    if (!hasNow) pts.push({ year: NOW_YEAR, usd_m2: h });
    pts.sort(function (a, b) { return a.year - b.year; });
    return pts;
  }

    const horLab = document.getElementById("priceHorizonLab");

    const gro = document.getElementById("priceGrowth");
