    if (horLab) horLab.textContent = "Horizon " + state.horizon + " yr";
    if (groLab) groLab.textContent = "Custom \u00b7 assumption, not a measured forecast \u00b7 " + pctLabel(state.growthR);
    if (customChip) customChip.textContent = "Custom " + pctLabel(state.growthR);
    if (gro) gro.value = String(state.growthR * 100);
    if (playLab) playLab.textContent = "Year " + state.playYear;
    const towns = priceChartTowns();
    const cmp = state.view === "compare";
    const endY = NOW_YEAR + (cmp ? (state.cmpYears === 10 ? 10 : 5) : state.horizon);
    const playY = cmp ? endY : state.playYear;
    let bits = [];
    if (cmp) {
      bits = towns.map(function (t) {
        const h = headlineOf(t);
        if (h == null) return "";
        const val = projPrice(h, R_BASE, endY);
        return "<div>" + esc(shortName(t)) + " \u00b7 " + endY + " Base " + pctLabel(R_BASE) + " \u00b7 " + fmtUsd(toDisplay(val)) + " " + unitLabel() + ' <span class="assumed">assumption</span></div>';
      });
    } else if (towns.length) {
      const t = towns[0];
      const h = headlineOf(t);
      if (h != null) {
        bits = scenarioSpecs().filter(function (sc) { return state.scenOn[sc.key]; }).map(function (sc) {
          const val = projPrice(h, sc.rate, playY);
          return "<div>" + esc(sc.label) + " " + pctLabel(sc.rate) + " \u00b7 " + playY + " \u00b7 " + fmtUsd(toDisplay(val)) + " " + unitLabel() + ' <span class="assumed">assumption</span></div>';
        });
      }
    }
    if (out) out.innerHTML = bits.join("");
    document.querySelectorAll("[data-proj]").forEach(function (b) {
      b.classList.toggle("on", Number(b.getAttribute("data-proj")) === (state.cmpYears === 10 ? 10 : 5));
    });
  }

  function bindPriceControls() {
    const hor = document.getElementById("priceHorizon");
    const gro = document.getElementById("priceGrowth");
    const play = document.getElementById("pricePlay");
    function clampPlay() {
      const maxY = NOW_YEAR + state.horizon;
      if (state.playYear > maxY) state.playYear = maxY;
      if (state.playYear < NOW_YEAR) state.playYear = NOW_YEAR;
    }
    function refresh() {
      clampPlay();
      if (hor) hor.value = String(state.horizon);
      if (gro) gro.value = String(state.growthR * 100);
      if (play) {
        play.min = String(NOW_YEAR);
        play.max = String(NOW_YEAR + state.horizon);
        play.value = String(state.playYear);
      }
      updatePriceLabels();
      renderPriceChart();
    }
    if (hor) {
      hor.oninput = function () {
        state.horizon = Math.max(1, Math.min(10, Math.round(Number(hor.value) || 5)));
        refresh();
      };
    }
    if (gro) {
      gro.oninput = function () {
        state.growthR = Math.max(0, Math.min(0.15, (Number(gro.value) || 12) / 100));
        refresh();
      };
    }
    if (play) {
      play.oninput = function () {
        state.playYear = Math.max(NOW_YEAR, Math.min(NOW_YEAR + state.horizon, Math.round(Number(play.value) || NOW_YEAR)));
        refresh();
      };
    }
    document.querySelectorAll("[data-proj]").forEach(function (b) {
      b.onclick = function () {
        state.cmpYears = Number(b.getAttribute("data-proj")) === 10 ? 10 : 5;
        refresh();
      };
    });
    document.querySelectorAll("[data-scen]").forEach(function (b) {
      b.onclick = function () {
        const k = b.getAttribute("data-scen");
        if (!k || !state.scenOn) return;
        state.scenOn[k] = !state.scenOn[k];
        b.classList.toggle("on", !!state.scenOn[k]);
        refresh();
      };
    });
    updatePriceLabels();
  }

  function scenarioSpecs() {
    return [
      { key: "conservative", rate: R_CONSERVATIVE, color: brandColor("--teal") || "#4A9D9C", dash: [6, 4], width: 2, label: "Conservative" },
      { key: "base", rate: R_BASE, color: brandColor("--coral") || "#FF6B47", dash: null, width: 3, label: "Base" },
      { key: "abundance", rate: R_ABUNDANCE, color: brandColor("--gold") || "#FFD166", dash: [2, 3], width: 2, label: "Abundance" },
      { key: "custom", rate: state.growthR, color: brandColor("--purple") || "#A78BFA", dash: [4, 3], width: 2, label: "Custom" }
    ];
  }

  function renderPriceChart() {
    const canvas = document.getElementById("priceChart");
    if (!canvas) return;
    const towns = priceChartTowns();
    if (!towns.length) return;
    const wrap = canvas.parentElement;
    const w = (wrap && wrap.clientWidth) ? wrap.clientWidth : 300;
    const h = (wrap && wrap.clientHeight) ? wrap.clientHeight : 320;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    const ctx = canvas.getContext("2d");
    if (!ctx) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    const foam = brandColor("--foam") || "#e7fbf6";
    const muted = brandColor("--muted") || "#6f8f94";
    const lineC = brandColor("--line") || "rgba(180,230,220,.12)";
    const bodyFont = getComputedStyle(document.body).fontFamily || "DM Sans, sans-serif";
    const cmp = state.view === "compare";
    const horizon = cmp ? (state.cmpYears === 10 ? 10 : 5) : state.horizon;
    const padL = 54;
    const padR = 18;
    const padT = 32;
    const padB = 34;
    const plotW = Math.max(10, w - padL - padR);
    const plotH = Math.max(10, h - padT - padB);

    const xMax = NOW_YEAR + horizon;
    const yMin = 0;
    let yMax = 1;
    const pack = towns.map(function (t, i) {
      const h0 = headlineOf(t);
      const paths = [];
      const histPts = [];
      const byY = {};
      seriesEntry(t.id).points.forEach(function (pt) {
        if (pt.year < NOW_YEAR && pt.usd_m2 != null) byY[pt.year] = pt.usd_m2;
      });
      const histYears = Object.keys(byY).map(Number);
      if (histYears.length) {
        const minY = Math.min.apply(null, histYears);
        for (let y = minY; y < NOW_YEAR; y++) {
          histPts.push(byY[y] != null ? { year: y, usd_m2: byY[y] } : { year: y, usd_m2: null });
        }
        if (h0 != null) histPts.push({ year: NOW_YEAR, usd_m2: h0 });
      }
      if (cmp) {
        const future = [];
        for (let y = NOW_YEAR; y <= NOW_YEAR + horizon; y++) {
          future.push({ year: y, usd_m2: projPrice(h0, R_BASE, y) });
        }
        paths.push({ pts: future, color: overlayColor(i).stroke, dash: [6, 5], width: 2, label: "assumption" });
      } else {
        scenarioSpecs().forEach(function (sc) {
          if (!state.scenOn[sc.key]) return;
          const future = [];
          for (let y = NOW_YEAR; y <= NOW_YEAR + horizon; y++) {
            future.push({ year: y, usd_m2: projPrice(h0, sc.rate, y) });
          }
          paths.push({ pts: future, color: sc.color, dash: sc.dash, width: sc.width, label: sc.label });
        });
      }
      paths.forEach(function (path) {
        path.pts.forEach(function (pt) {
          const dy = toDisplay(pt.usd_m2);
          if (dy != null && dy > yMax) yMax = dy;
        });
      });
      histPts.forEach(function (pt) {
        const dy = pt.usd_m2 != null ? toDisplay(pt.usd_m2) : null;
        if (dy != null && dy > yMax) yMax = dy;
      });
      const nowD = toDisplay(h0);
      if (nowD != null && nowD > yMax) yMax = nowD;
      return { t: t, h0: h0, paths: paths, hist: histPts, color: overlayColor(i).stroke };
    });
    let histMin = NOW_YEAR;
    pack.forEach(function (row) {
      (row.hist || []).forEach(function (pt) {
        if (pt && pt.year < histMin && pt.usd_m2 != null) histMin = pt.year;
      });
    });

    yMax = yMax * 1.14;
    if (yMax <= 0) yMax = 1;

    function xOf(year) {
      const nowX = padL + 0.4 * plotW;
      if (year >= NOW_YEAR) {
        if (year === NOW_YEAR) return nowX;
        const span = Math.max(1, xMax - NOW_YEAR);
        return nowX + ((year - NOW_YEAR) / span) * (0.6 * plotW);
      }
      if (histMin >= NOW_YEAR) return nowX;
      return padL + ((year - histMin) / (NOW_YEAR - histMin)) * (0.4 * plotW);
    }
    function yOf(usd) {
      return padT + (1 - (usd - yMin) / (yMax - yMin)) * plotH;
    }

    ctx.font = "10px " + bodyFont;
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.strokeStyle = lineC;
    ctx.lineWidth = 1;
    const yTicks = 4;
    for (let i = 0; i <= yTicks; i++) {
      const v = yMin + (yMax - yMin) * i / yTicks;
      const y = yOf(v);
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(w - padR, y);
      ctx.stroke();
      ctx.fillStyle = muted;
      ctx.fillText(fmtUsd(v), padL - 6, y);
    }
    ctx.textAlign = "right";
    ctx.textBaseline = "bottom";
    ctx.fillStyle = muted;
    ctx.fillText(unitLabel(), padL - 6, padT - 6);

    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    const yearSpan = xMax - NOW_YEAR;
    const yearStep = yearSpan > 8 ? 2 : 1;
    const tickYears = {};
    if (histMin < NOW_YEAR) {
      pack.forEach(function (row) {
        (row.hist || []).forEach(function (pt) {
          if (pt && pt.usd_m2 != null && pt.year < NOW_YEAR) tickYears[pt.year] = true;
        });
      });
    }
    for (let year = NOW_YEAR; year <= xMax; year += yearStep) tickYears[year] = true;
    Object.keys(tickYears).map(Number).sort(function (a, b) { return a - b; }).forEach(function (year) {
      ctx.fillStyle = muted;
      ctx.fillText(String(year), xOf(year), h - padB + 8);
    });

    const xNow = xOf(NOW_YEAR);
    ctx.save();
    ctx.strokeStyle = foam;
    ctx.globalAlpha = 0.5;
    ctx.lineWidth = 1;
    ctx.setLineDash([2, 3]);
    ctx.beginPath();
    ctx.moveTo(xNow, padT);
    ctx.lineTo(xNow, padT + plotH);
    ctx.stroke();
    ctx.restore();
    ctx.fillStyle = foam;
    ctx.font = "600 10px " + bodyFont;
    ctx.textAlign = "left";
    ctx.textBaseline = "bottom";
    ctx.fillText("TODAY", xNow + 6, padT - 4);

    if (!cmp && state.playYear != null) {
      const xPlay = xOf(state.playYear);
      ctx.save();
      ctx.strokeStyle = brandColor("--purple") || "#A78BFA";
      ctx.globalAlpha = 0.7;
      ctx.lineWidth = 1.2;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(xPlay, padT);
      ctx.lineTo(xPlay, padT + plotH);
      ctx.stroke();
      ctx.restore();
    }

    function drawPath(pts, color, dash, width) {
      if (!pts.length) return;
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = width || 2;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      if (dash) ctx.setLineDash(dash);
      else ctx.setLineDash([]);
      let started = false;
      pts.forEach(function (pt) {
        if (!pt || pt.usd_m2 == null || toDisplay(pt.usd_m2) == null) {
          if (started) ctx.stroke();
          started = false;
          return;
        }
        const x = xOf(pt.year);
        const y = yOf(toDisplay(pt.usd_m2));
        if (!started) {
          ctx.beginPath();
          ctx.moveTo(x, y);
          started = true;
        } else ctx.lineTo(x, y);
      });
      if (started) ctx.stroke();
      ctx.restore();
    }

    pack.forEach(function (row) {
      if (row.hist && row.hist.length) {
        drawPath(row.hist, foam, null, 2);
        row.hist.forEach(function (pt) {
          if (!pt || pt.usd_m2 == null || pt.year >= NOW_YEAR) return;
          ctx.fillStyle = foam;
          ctx.beginPath();
          ctx.arc(xOf(pt.year), yOf(toDisplay(pt.usd_m2)), 3, 0, Math.PI * 2);
          ctx.fill();
        });
      }
      row.paths.forEach(function (path) {
        drawPath(path.pts, path.color, path.dash, path.width);
      });
      ctx.fillStyle = cmp ? row.color : (foam);
      ctx.beginPath();
      ctx.arc(xOf(NOW_YEAR), yOf(toDisplay(row.h0)), 4, 0, Math.PI * 2);
      ctx.fill();
    });

    if (cmp && pack.length) {
      ctx.font = "600 10px " + bodyFont;
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      let lx = padL + 8;
      const ly = padT + 12;
      pack.forEach(function (row) {
        ctx.fillStyle = row.color;
        ctx.beginPath();
        ctx.arc(lx, ly, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = foam;
        const name = shortName(row.t);
        ctx.fillText(name, lx + 8, ly);
        lx += ctx.measureText(name).width + 22;
      });
      ctx.fillStyle = muted;
      ctx.font = "10px " + bodyFont;
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillText("Base " + pctLabel(R_BASE) + " assumption", w - padR, padT + 12);
    }
  }

  function viewportH() {
    if (window.visualViewport && window.visualViewport.height) return window.visualViewport.height;
    return window.innerHeight;
  }

  function peekHeight() {
    return Math.round(viewportH() * 0.64);
  }

  function fullHeight() {
    return Math.round(viewportH());
  }

  function chartTownIds() {
    if (state.view === "compare") return expandSpiderIds(state.compare || []);
    if (state.selected === "punta-mita") return expandSpiderIds(["punta-mita"]);
    if (state.selected) return [state.selected];
    return [];
  }

  let radarRoot = null;
  let radarHost = null;

  function gappedRadarShape(props) {
    const h = window.React.createElement;
    const key = props.dataKey;
    const pts = (props.points || []).filter(function (p) {
      if (!p) return false;
      const raw = p.payload ? p.payload[key] : p.value;
      return raw != null && raw === raw;
    });
    const kids = [];
    if (pts.length >= 2) {
      let d = "";
      pts.forEach(function (p, i) { d += (i ? "L" : "M") + p.x + "," + p.y; });
      if (pts.length >= 3) d += "Z";
      kids.push(h("path", {
        key: "web",
        d: d,
        fill: pts.length >= 3 ? props.fill : "none",
        fillOpacity: pts.length >= 3 ? (props.fillOpacity != null ? props.fillOpacity : 0.3) : 0,
        stroke: props.stroke,
        strokeWidth: 2,
        strokeLinejoin: "round",
        strokeLinecap: "round"
      }));
    }
    pts.forEach(function (p, i) {
      kids.push(h("circle", { key: "dot" + i, cx: p.x, cy: p.y, r: 3, fill: props.stroke }));
    });
    return h("g", null, kids);
  }

  function renderChart(ids) {
    const host = document.getElementById("radar");
    if (!host) return;
    const series = spiderSeriesFromIds((ids && ids.length) ? ids : chartTownIds());
    if (!series.length) return;

    const wrap = host.parentElement;
    const hits = document.getElementById("radarHits");
    const w = (wrap && wrap.clientWidth) ? wrap.clientWidth : 300;
    const hgt = (wrap && wrap.clientHeight) ? wrap.clientHeight : 250;
    const n = RADAR_AXES.length;
    const cx = w / 2;
    const cy = hgt / 2 + 2;
    const pad = Math.max(56, Math.min(72, Math.min(w, hgt) * 0.26));
    const R = Math.max(48, Math.min(w, hgt) / 2 - pad);

    function pt(i, r) {
      const a = -Math.PI / 2 + i * 2 * Math.PI / n;
      return { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, a: a };
    }

    const data = RADAR_AXES.map(function (ax, i) {
      const rec = { axis: ax.label };
      series.forEach(function (s, si) {
        const v = s.values[i];
        if (v != null) rec["s" + si] = v;
      });
      return rec;
    });

    const grid = brandColor("--radar-grid") || brandColor("--line") || "rgba(90,180,190,.18)";

    if (window.React && window.ReactDOM && window.ReactDOM.createRoot && window.Recharts) {
      if (radarRoot && radarHost !== host) {
        try { radarRoot.unmount(); } catch (e) {}
        radarRoot = null;
      }
      if (!radarRoot) {
        radarRoot = window.ReactDOM.createRoot(host);
        radarHost = host;
      }
      const RC = window.Recharts;
      const h = window.React.createElement;
      const radars = series.map(function (s, si) {
        return h(RC.Radar, {
          key: "s" + si,
          name: s.label,
          dataKey: "s" + si,
          stroke: s.color.stroke,
          fill: s.color.stroke,
          fillOpacity: 0.3,
          isAnimationActive: false,
          dot: false,
          legendType: "none",
          shape: gappedRadarShape
        });
      });
      radarRoot.render(
        h(RC.ResponsiveContainer, { width: "100%", height: "100%" },
          h(RC.RadarChart, { data: data, cx: "50%", cy: "52%", outerRadius: "58%" },
            h(RC.PolarGrid, { gridType: "polygon", stroke: grid, radialLines: true }),
            h(RC.PolarAngleAxis, { dataKey: "axis", tick: false }),
            h(RC.PolarRadiusAxis, { angle: 90, domain: [0, 10], tick: false, axisLine: false, tickCount: 6 }),
            radars
          )
        )
      );
    }

    const labelR = R + 26;
    const hitHtml = [];
    const defineTown = town(state.selected) || town((state.compare || [])[0]) || town("punta-mita");
    for (let i = 0; i < n; i++) {
      const vals = [];
      series.forEach(function (s) {
        if (s.values[i] != null) vals.push(s.values[i]);
      });
      const known = vals.length > 0;
      const p = pt(i, labelR);
      const cos = Math.cos(p.a);
      const sin = Math.sin(p.a);
      let tf = "translate(-50%,-50%)";
      if (cos > 0.35) tf = "translate(0,-50%)";
      else if (cos < -0.35) tf = "translate(-100%,-50%)";
      else if (sin < -0.4) tf = "translate(-50%,-100%)";
      else if (sin > 0.4) tf = "translate(-50%,0)";
      let lab = RADAR_AXES[i].label;
      if (!known) lab += " \u2014";
      else if (series.length === 1) lab += " " + fmtAxis(vals[0]);
      else if (vals.length === series.length && vals.every(function (v) { return v === vals[0]; })) lab += " " + fmtAxis(vals[0]);
      hitHtml.push(
        '<button type="button" class="radar-hit' + (known ? "" : " unk") +
        '" data-axis="' + RADAR_AXES[i].def +
        '" aria-label="' + esc(RADAR_AXES[i].label) +
        '" style="left:' + p.x.toFixed(1) + "px;top:" + p.y.toFixed(1) +
        "px;transform:" + tf + '">' +
        esc(lab) + "</button>"
      );
    }
    if (hits) {
      hits.innerHTML = hitHtml.join("");
      hits.querySelectorAll("[data-axis]").forEach(function (b) {
        b.onclick = function (e) {
          e.stopPropagation();
          openDefine(b.getAttribute("data-axis"), defineTown);
        };
      });
    }
  }

  function applySheetSnap(mode) {
    sheetSnap = mode === "full" ? "full" : "peek";
    const sheet = document.getElementById("sheet");
    const dock = document.getElementById("dock");
    const handle = document.getElementById("sheetHandle");
    if (!sheet) return;
    if (isDesktop()) {
      sheet.classList.remove("snap-full", "dragging");
      sheet.style.height = "";
      sheet.style.top = "";
      if (dock) dock.classList.remove("tucked");
      if (handle) handle.setAttribute("aria-valuenow", "0");
      return;
    }
    sheet.classList.toggle("snap-full", sheetSnap === "full");
    sheet.style.height = "";
    sheet.style.top = "";
    if (dock) dock.classList.toggle("tucked", sheetSnap === "full");
    if (handle) handle.setAttribute("aria-valuenow", sheetSnap === "full" ? "1" : "0");
  }

  function resetSheetSnap() {
    sheetSnap = "peek";
    const sheet = document.getElementById("sheet");
    const dock = document.getElementById("dock");
    const handle = document.getElementById("sheetHandle");
    if (sheet) {
      sheet.classList.remove("snap-full", "dragging");
      sheet.style.height = "";
      sheet.style.top = "";
    }
    if (dock) dock.classList.remove("tucked");
    if (handle) handle.setAttribute("aria-valuenow", "0");
  }

  function bindSheetSnap() {
    const handle = document.getElementById("sheetHandle");
    const sheet = document.getElementById("sheet");
    if (!handle || !sheet) return;
    let drag = null;

    function clientY(e) {
      if (e.touches && e.touches.length) return e.touches[0].clientY;
      if (e.changedTouches && e.changedTouches.length) return e.changedTouches[0].clientY;
      return e.clientY;
    }

    function startDrag(e, fromHandle) {
      if (isDesktop() || !sheet.classList.contains("open")) return;
      if (drag) return;
      if (e.pointerType === "mouse" && e.button !== 0) return;
      if (!fromHandle && e.target.closest("button, a, input, select, textarea, [data-metric], [data-axis]")) return;
      const y = clientY(e);
      if (y == null) return;
      drag = {
        startY: y,
        startH: sheet.getBoundingClientRect().height,
        lastY: y,
        lastT: performance.now(),
        vy: 0,
        moved: 0,
        fromHandle: !!fromHandle
      };
      sheet.classList.add("dragging");
      sheet.style.height = drag.startH + "px";
      sheet.classList.remove("snap-full");
      sheet.style.top = "";
      const capEl = fromHandle ? handle : (e.currentTarget || sheet);
      if (e.pointerId != null && capEl.setPointerCapture) {
        try { capEl.setPointerCapture(e.pointerId); } catch (err) {}
      }
      e.preventDefault();
    }

    function onMove(e) {
      if (!drag) return;
      const y = clientY(e);
      if (y == null) return;
      const now = performance.now();
      const dt = now - drag.lastT;
      if (dt > 0) drag.vy = (y - drag.lastY) / dt;
      drag.lastY = y;
      drag.lastT = now;
      drag.moved = Math.max(drag.moved, Math.abs(y - drag.startY));
      const next = Math.max(peekHeight(), Math.min(fullHeight(), drag.startH + (drag.startY - y)));
      sheet.style.height = next + "px";
      e.preventDefault();
    }

    function onUp() {
      if (!drag) return;
      const fromHandle = drag.fromHandle;
      const moved = drag.moved;
      const vy = drag.vy;
      const h = sheet.getBoundingClientRect().height;
      drag = null;
      sheet.classList.remove("dragging");
      if (fromHandle && moved < 8) {
        applySheetSnap(sheetSnap === "full" ? "peek" : "full");
        return;
      }
      const peek = peekHeight();
      const full = fullHeight();
      const span = Math.max(1, full - peek);
      let snap = (h - peek) >= span * 0.5 ? "full" : "peek";
      if (vy < -0.45) snap = "full";
      else if (vy > 0.45) snap = "peek";
      applySheetSnap(snap);
    }

    function onHandleDown(e) { startDrag(e, true); }
    function onSheetDown(e) {
      if (e.target.closest("#sheetHandle") || e.target.closest(".handle-hit")) return;
      if (e.target.closest(".sheet-head")) startDrag(e, false);
    }

    handle.addEventListener("pointerdown", onHandleDown);
    sheet.addEventListener("pointerdown", onSheetDown);
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
    handle.addEventListener("touchstart", onHandleDown, { passive: false });
    sheet.addEventListener("touchstart", onSheetDown, { passive: false });
    window.addEventListener("touchmove", onMove, { passive: false });
    window.addEventListener("touchend", onUp);
    window.addEventListener("touchcancel", onUp);
  }

  function isAlreadyHere(item) {
    return item.stage === "open" || !!item.priced_in;
  }

  function isComingItem(item) {
    return item.stage !== "open";
  }

  function nowTickLabel() {
    const d = new Date();
    const mo = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    return d.getDate() + " " + mo[d.getMonth()] + " " + d.getFullYear();
  }

  function yearWindow(item) {
    const lab = comingDateLabel(item);
    return lab === "Date unconfirmed" ? null : lab;
  }

  function comingDateLabel(item) {
    const raw = [item.window, item.guests_from, item.date_or_window, item.meta].filter(function (x) { return x != null && String(x).trim() !== ""; }).join(" ");
    if (!raw) return "Date unconfirmed";
    const s = String(raw);
    const anticipated = /anticipat/i.test(s);
    const seasonal = s.match(/\b((?:early|mid|late|winter|spring|summer|fall|autumn)\s+20\d{2})\b/i);
    if (seasonal) return seasonal[1];
    const y = s.match(/\b(20\d{2})\b/);
    if (y) return anticipated ? (y[1] + " anticipated") : y[1];
    return "Date unconfirmed";
  }

  function comingLetter(item) {
    const s = String(item.name || item.brand || "?").replace(/^\s+/, "");
    return (s.charAt(0) || "?").toUpperCase();
  }

  function regionNoteFor(h) {
    const name = h.official_name || h.brand || "";
    if (/edition/i.test(name) || /edition/i.test(h.brand || "")) return "Nayarit \u00b7 unlocated";
    const town = h.town || "";
    if (/thompson/i.test(name) || (/puerto vallarta/i.test(town) && !h.town_id)) return "Puerto Vallarta";
    if (/milaroca|belmond/i.test(name)) return "Riviera Nayarit";
    if (/siari/i.test(name)) return "La Pe\u00f1ita de Jaltemba";
    if (/mandarina/i.test(name)) return "Mandarina";
    if (town) return town;
    return "unlocated";
  }

  function buildPipeline(hotelData) {
    const items = [];
    const wc = {};
    ((hotelData && hotelData.whats_coming_not_priced_in) || []).forEach(function (row) {
      if (row && row.name) wc[row.name] = row;
    });
    ((hotelData && hotelData.pvr_radius) || []).forEach(function (h) {
      const name = h.official_name || h.brand;
      const hit = wc[name];
      const townIds = h.town_id ? [h.town_id] : [];
      items.push({
        name: name,
        brand: h.brand,
        stage: h.stage,
        priced_in: !!h.priced_in,
        town_ids: townIds,
        regionNote: townIds.length ? null : regionNoteFor(h),
        guests_from: h.guests_from || null,
        date_or_window: h.date_or_window || null,
        window: (hit && hit.window) || null,
        dispute: h.dispute || null,
        kind: "hotel"
      });
    });
    const auto = CATALOG.autopista_las_varas_bucerias_pv;
    if (auto) {
      const ids = TOWNS.filter(function (t) {
        return (t.catalysts || []).indexOf("autopista_las_varas_bucerias_pv") !== -1;
      }).map(function (t) { return t.id; });
      items.push({
        name: auto.label,
        stage: auto.stage,
        priced_in: !!auto.priced_in,
        town_ids: ids,
        regionNote: null,
        guests_from: null,
        date_or_window: auto.meta || null,
        window: null,
        kind: "infra"
      });
    }
    const amado = CATALOG.puente_amado_nervo;
    if (amado) {
      items.push({
        name: amado.label,
        stage: amado.stage,
        priced_in: !!amado.priced_in,
        town_ids: ["nuevo-vallarta"],
        regionNote: null,
        guests_from: null,
        date_or_window: amado.meta || null,
        window: null,
        kind: "infra"
      });
    }
    const lit = CATALOG.litibu_bay_club;
    if (lit) {
      const hit = wc["Litib\u00fa Bay Club"];
      items.push({
        name: lit.label,
        stage: lit.stage,
        priced_in: !!lit.priced_in,
        town_ids: ["litibu"],
        regionNote: null,
        guests_from: null,
        date_or_window: lit.meta || (hit && hit.window) || null,
        window: (hit && hit.window) || null,
        kind: "infra"
      });
    }
    const teh = CATALOG.tehuamixtle_hotels;
    if (teh) {
      items.push({
        name: "Tehuamixtle / Mayto eco-hotels",
        stage: teh.stage,
        priced_in: !!teh.priced_in,
        town_ids: ["tehuamixtle"],
        regionNote: null,
        guests_from: null,
        date_or_window: null,
        window: null,
        kind: "infra"
      });
    }
    return items;
  }

  function itemsForTown(townId) {
    return PIPELINE.filter(function (it) { return it.town_ids.indexOf(townId) !== -1; });
  }

  function regionItems() {
    return PIPELINE.filter(function (it) { return !it.town_ids.length; });
  }

  function comingYearKey(item) {
    const w = yearWindow(item) || "";
    const y = w.match(/20\d{2}/);
    return y ? Number(y[0]) : 9999;
  }

  function partitionComing(list) {
    const here = [];
    const future = [];
    list.forEach(function (it) {
      if (isAlreadyHere(it)) here.push(it);
      else future.push(it);
    });
    future.sort(function (a, b) { return comingYearKey(a) - comingYearKey(b); });
    return { here: here, future: future };
  }

  function comingFilterBar() {
    const f = state.comingFilter || "all";
    const chip = function (id, label) {
      return '<button type="button" class="filter-chip' + (f === id ? " on" : "") + '" data-cfil="' + id + '">' + label + "</button>";
    };
    return '<div class="filters coming-fil">' + chip("all", "All") + chip("coming", "Coming") + chip("here", "Already here") + "</div>";
  }

  function comingRowHtml(item, i, showPlace) {
    const here = isAlreadyHere(item);
    const pal = i % 2 ? "sand" : "mint";
    const stageChip = here
      ? '<span class="chip here">already here</span>'
      : '<span class="chip ' + (STAGE_CHIP[item.stage] || "none") + '">' + esc(STAGE_LABEL[item.stage] || item.stage) + "</span>";
    const dateLab = comingDateLabel(item);
    let html = '<li class="coming-row' + (here ? " here" : "") + '">';
    html += '<div class="mono ' + pal + '" aria-hidden="true">' + esc(comingLetter(item)) + "</div>";
    html += '<div class="coming-body">';
    html += '<div class="coming-title">' + esc(item.name) + "</div>";
    if (showPlace && item.regionNote) html += '<div class="coming-place">' + esc(item.regionNote) + "</div>";
    html += '<div class="coming-meta">' + stageChip;
    if (item.dispute && item.dispute.status === "disputed") {
      html += '<span class="chip dispute">DISPUTED</span>';
    }
    html += '<span class="coming-date">' + esc(dateLab) + "</span>";
    html += "</div>";
    if (!here) html += '<div class="coming-hint">buy before it prices in</div>';
    if (item.dispute && item.dispute.status === "disputed" && item.dispute.rule) {
      html += '<div class="coming-hint coming-dispute">' + esc(item.dispute.rule) + "</div>";
    }
    html += "</div></li>";
    return html;
  }

  function comingTrackHtml(items, opts) {
    const showPlace = !!(opts && opts.showPlace);
    const f = state.comingFilter || "all";
    const parts = partitionComing(items);
    const showHere = f === "all" || f === "here";
    const showFut = f === "all" || f === "coming";
    const hereV = [];
    const futV = showFut ? parts.future.filter(function (it) { return !isAlreadyHere(it); }) : [];
    if (!hereV.length && !futV.length) return '<p class="coming-empty">Nothing new on file.</p>';
    let html = '<ol class="coming-list">';
    hereV.forEach(function (it, i) { html += comingRowHtml(it, i, showPlace); });
    html += '<li class="coming-now"><span class="coming-now-tick"></span><span class="coming-now-lab">NOW \u00b7 ' + esc(nowTickLabel()) + "</span></li>";
    futV.forEach(function (it, i) { html += comingRowHtml(it, i + hereV.length, showPlace); });
    html += "</ol>";
    return html;
  }

  function comingHtml(t) {
    let html = '<div class="coming"><div class="group-h">What\'s coming</div>';
    html += comingFilterBar();
    html += comingTrackHtml(itemsForTown(t.id), { showPlace: false });
    html += "</div>";
    return html;
  }

  function regionComingHtml() {
    let html = '<div class="coming coming-region"><div class="group-h">What\'s coming \u00b7 region</div>';
    html += comingFilterBar();
    html += comingTrackHtml(regionItems(), { showPlace: true });
    html += "</div>";
    return html;
  }

  function homesEmptyHtml() {
    return '<div class="homes-shelf"><div class="group-h">Homes</div>' +
      '<p class="home-empty">Homes load overnight. Nothing scraped yet.</p></div>';
  }

  function homesHtml(t) {
    if (!t) return homesEmptyHtml();
    const block = HOMES && HOMES.towns ? HOMES.towns[t.id] : null;
    const listings = block && Array.isArray(block.listings) ? block.listings : [];
    const n = block && typeof block.n === "number" ? block.n : listings.length;
    if (!block || n === 0 || !listings.length) return homesEmptyHtml();
    function row(lab, val, cls) {
      if (val == null || val === "") return "";
      return '<div class="home-row"><span>' + esc(lab) + "</span><b" + (cls ? ' class="' + cls + '"' : "") + ">" + esc(val) + "</b></div>";
    }
    let html = '<div class="homes-shelf"><div class="group-h">Homes</div><div class="homes-list">';
    listings.forEach(function (L) {
      if (!L) return;
      const sale = L.asking_price_usd != null ? fmtUsd(L.asking_price_usd) : null;
      const photo = L.photo_url
        ? '<img src="' + esc(L.photo_url) + '" alt="" loading="lazy" decoding="async" onerror="this.remove()">'
        : "";
      const ocean = (L.beachfront === "yes" || L.beachfront === true)
        ? "Yes"
        : (L.beachfront === "no" || L.beachfront === false) ? "No" : null;
      const src = L.source === "homia" ? "Homia" : (L.source === "inmuebles24" ? "Inmuebles24" : (L.source || null));
      const size = L.m2 != null ? (String(L.m2) + " m\u00b2") : null;
      const um2 = L.usd_m2 != null ? (fmtUsd(toDisplay(L.usd_m2)) + " " + unitLabel()) : null;
      const beds = L.beds != null ? String(L.beds) : null;
      const baths = L.baths != null ? String(L.baths) : null;
      const inner =
        '<div class="home-photo" aria-hidden="true">' + (photo ? photo : "") + "</div>" +
        '<div class="home-body">' +
        '<div class="home-top"><div class="home-title">' + esc(L.title || "\u2014") + "</div>" +
        (sale ? '<div class="home-sale">' + esc(sale) + "</div>" : "") + "</div>" +
        (src ? '<div class="home-sub">' + esc(src) + (L.date_seen ? " \u00b7 " + esc(L.date_seen) : "") + "</div>" : "") +
        '<div class="home-rows">' +
        row("Oceanfront", ocean, ocean === "Yes" ? "ok" : "") +
        row("Beds", beds) +
        row("Baths", baths) +
        row("Size", size) +
        row("Asking " + unitLabel(), um2) +
        "</div></div>";
      if (L.listing_url) {
        html += '<a class="home-card" href="' + esc(L.listing_url) + '" target="_blank" rel="noopener noreferrer">' + inner + "</a>";
      } else {
        html += '<div class="home-card">' + inner + "</div>";
      }
    });
    html += "</div></div>";
    return html;
  }

  function loadData() {
    return Promise.all([
      fetch("pvr-towns-aug2026.json", { cache: "no-store" }).then(function (r) {
        if (!r.ok) throw new Error("fetch " + r.status);
        return r.json();
      }),
      fetch("hotel-pipeline-aug2026.json", { cache: "no-store" }).then(function (r) {
        if (!r.ok) throw new Error("hotels " + r.status);
        return r.json();
      }),
      fetch("scores-spider-aug2026.json", { cache: "no-store" }).then(function (r) {
        if (!r.ok) throw new Error("scores " + r.status);
        return r.json();
      }),
      fetch("price-series-aug2026.json", { cache: "no-store" }).then(function (r) {
        if (!r.ok) return {};
        return r.json();
      }).catch(function () { return {}; }),
      fetch("punta-mita-gates-aug2026.json", { cache: "no-store" }).then(function (r) {
        if (!r.ok) return null;
        return r.json();
      }).catch(function () { return null }),
      loadHomes()
    ]);
  }

  function loadHomes() {
    const fallback = "homes/2026-08-28.json";
    function pull(url) {
      return fetch(url, { cache: "no-store" }).then(function (r) {
        if (!r.ok) throw new Error("homes " + r.status);
        return r.json();
      });
    }
    return pull("homes/latest.json").then(function (latest) {
      if (latest && latest.towns) return latest;
      const raw = latest && latest.file ? String(latest.file) : "";
      const file = raw.replace(/^.*\//, "");
      return pull(file ? ("homes/" + file) : fallback);
    }).catch(function () {
      return pull(fallback);
    }).catch(function () {
      return null;
    });
  }

  function ingestScores(scoreData) {
    SCORES_META = (scoreData && scoreData.meta) || null;
    SCORES = {};
    ((scoreData && scoreData.scored) || []).forEach(function (row) {
      if (row && row.id) SCORES[row.id] = row;
    });
  }

  function ingestSeries(data) {
    SERIES = {};
    ((data && data.towns) || []).forEach(function (row) { if (row && row.id) SERIES[row.id] = row; });
  }

  function boot(data, hotelData, scoreData, seriesData, gatesData, homesData) {
    DATASET = data;
    CATALOG = data.catalysts_catalog || {};
    HURR_REGION = data.hurricane_region || null;
    TOWNS = (data.towns || []).map(function (t) {
      return Object.assign({}, t, { off_map: false });
    });
    CABO = (data.peers_off_map && data.peers_off_map[0]) ? Object.assign({}, data.peers_off_map[0], {
      peer: true,
      off_map: true,
      catalysts: [],
      hurricane: { note: null },
      drive_min_to_pvr: { basis: "off_map", label: "off-map" },
      access: "off_map"
    }) : null;
    CC = TOWNS.find(function (t) { return t.id === "conchas-chinas"; }) || null;
    PIPELINE = buildPipeline(hotelData || {});
    ingestScores(scoreData || {});
    ingestSeries(seriesData || {});
    GATES = gatesData && typeof gatesData === "object" ? gatesData : null;
    HOMES = homesData && homesData.towns ? homesData : null;
    buildAnclote();

    const brandH = document.querySelector(".brand h1");
    if (brandH) brandH.textContent = BRAND.short;
    updateTopbarSubtitle();
    const tm = document.querySelector('meta[name="theme-color"]');
    if (tm) tm.setAttribute("content", brandColor("--bg"));

    if (preview) {
      const qa = document.getElementById("qaChip");
      if (qa) qa.hidden = false;
    }

    const pvr = data.meta && data.meta.center
      ? [data.meta.center.lat, data.meta.center.lng]
      : [20.68083, -105.25556];

    map = L.map("map", { zoomControl: false, attributionControl: false, minZoom: 7, maxZoom: 13 }).setView(pvr, 9);
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
      attribution: "", maxZoom: 16
    }).addTo(map);

    const accent = brandColor("--accent");
    radius = L.circle(pvr, {
      radius: 90 * 700, color: accent, weight: 1.2, dashArray: "5 8",
      fillColor: accent, fillOpacity: 0.05, interactive: false
    }).addTo(map);

    L.marker(pvr, {
      icon: L.divIcon({ className: "", html: '<div class="airport">PVR</div>', iconSize: [22, 22] }),
      zIndexOffset: 500, interactive: false
    }).addTo(map);

    TOWNS.forEach(function (t) {
      const m = L.marker([t.lat, t.lng], { icon: iconFor(t), keyboard: true, title: t.name }).addTo(map);
      m.on("click", function () { onTownTap(t.id, "map"); });
      markers[t.id] = m;
    });

    document.querySelector(".drive").addEventListener("click", function (e) {
      const b = e.target.closest("button");
      if (b) setMinutes(Number(b.dataset.min));
    });

    document.getElementById("openList").onclick = function () { openView("list"); };
    document.getElementById("openSettings").onclick = function () { openSettings(); };
    const railBtn = document.getElementById("toggleContentFull");
    if (railBtn) {
      railBtn.onclick = function () {
        setRailMode(getRailMode() === "full" ? "split" : "full");
      };
    }
    applyRailMode();

    const credit = document.getElementById("mapCredit");
    if (credit) {
      credit.onclick = function () {
        const open = credit.classList.toggle("open");
        credit.setAttribute("aria-expanded", open ? "true" : "false");
      };
    }

    window.addEventListener("resize", onResize);
    bindSheetSnap();
    setMinutes(90);
    openView("list");
  }

  function markerClass(t) {
    const sel = state.selected === t.id || state.compare.indexOf(t.id) !== -1;
    let c = "dot";
    if (t.access === "boat") c += " boat";
    const tier = tierOf(t);
    if (tier === "primary") c += " primary";
    else if (tier === "unknown") c += " unknown";
    if (!unlocked(t.id)) c += " locked";
    if (sel) c += " sel";
    return c;
  }

  function iconFor(t) {
    return L.divIcon({
      className: "",
      html: '<div class="' + markerClass(t) + '"></div><div class="lbl">' + esc(shortName(t)) + "</div>",
      iconSize: [14, 14]
    });
  }

  function refreshMarkers() {
    TOWNS.forEach(function (t) {
      markers[t.id].setIcon(iconFor(t));
      if (inRadius(t)) {
        if (!map.hasLayer(markers[t.id])) markers[t.id].addTo(map);
        markers[t.id].setOpacity(1);
      } else if (map.hasLayer(markers[t.id])) {
        map.removeLayer(markers[t.id]);
      }
    });
    const n = TOWNS.filter(inRadius).length;
    document.getElementById("count").textContent = n + " towns · " + state.minutes + " min";
  }

  function setMinutes(min) {
    state.minutes = min;
    document.querySelectorAll(".drive button").forEach(function (b) {
      b.classList.toggle("on", Number(b.dataset.min) === min);
    });
    radius.setRadius(min * 700);
    refreshMarkers();
    const vis = TOWNS.filter(inRadius);
    if (vis.length) {
      const pvr = DATASET.meta.center;
      const b = L.latLngBounds(vis.map(function (t) { return [t.lat, t.lng]; }));
      b.extend([pvr.lat, pvr.lng]);
      map.fitBounds(b.pad(0.18), { animate: true, maxZoom: min <= 30 ? 11 : min <= 60 ? 10 : 9 });
    }
    if (state.view === "list") paintSheet();
  }

  function onTownTap(id, src) {
    const t = town(id);
    if (!t) return;
    if (!unlocked(id)) {
      openPro(id);
      return;
    }
    if (src === "list" || src === "map") addToCompare(id);
    if (src === "map" || src === "list-detail") openView("detail", id);
    else {
      paintDock();
      refreshMarkers();
      if (state.view === "list") paintSheet();
    }
  }

  function addToCompare(id) {
    if (!unlocked(id)) {
      openPro(id);
      return false;
    }
    if (state.compare.indexOf(id) !== -1) return true;
    if (state.compare.length >= 4) {
      showToast("Compare is capped at 4 towns");
      return false;
    }
    state.compare.push(id);
    paintDock();
    refreshMarkers();
    return true;
  }

  function removeFromCompare(id) {
    state.compare = state.compare.filter(function (x) { return x !== id; });
    paintDock();
    refreshMarkers();
    if (state.view === "compare") {
      if (state.compare.length) paintSheet();
      else openView(isDesktop() ? "list" : "map");
    }
  }

  function openPro(id) {
    state.proId = id;
    const t = town(id);
    const modal = document.getElementById("modal");
    modal.hidden = false;
    modal.innerHTML =
      '<div class="modal-card" role="dialog" aria-labelledby="proTitle">' +
      '<h2 id="proTitle">' + esc(BRAND.name) + " Pro</h2>" +
      '<p class="meta" style="margin:0 0 10px">' + esc(t ? t.name : "This pin") + " is locked on the free PVR map.</p>" +
      "<p>Free towns: Bucerías, Nuevo Vallarta, Sayulita, Punta Mita, Conchas Chinas. Other pins and Cabo Médano are Pro.</p>" +
      '<div class="price-pair"><span>$19 / mo</span><span>$99 / yr</span></div>' +
      '<p class="caption">No invented asking ' + unitLabel() + ". Unknown stays unknown.</p>" +
      '<button type="button" class="btn-a" id="closePro" style="width:100%">Close</button></div>';
    document.getElementById("closePro").onclick = closePro;
    modal.onclick = function (e) { if (e.target === modal) closePro(); };
  }

  function openSettings() {
    const modal = document.getElementById("modal");
    const plan = getPlan();
    const unit = getUnit();
    modal.hidden = false;
    modal.innerHTML =
      '<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">' +
      '<div class="sheet-head" style="margin-bottom:8px">' +
      '<h2 id="settingsTitle">Settings</h2>' +
      '<button type="button" class="x" id="closeSettings" aria-label="Close">\u00d7</button></div>' +
      '<div class="settings-row">' +
      '<span class="settings-lab">View</span>' +
      '<div class="plan-row" id="planChips">' +
      '<button type="button" class="filter-chip' + (plan === "light" ? " on" : "") + '" data-plan="light">Light</button>' +
      '<button type="button" class="filter-chip' + (plan === "pro" ? " on" : "") + '" data-plan="pro">Pro</button>' +
      "</div></div>" +
      '<div class="settings-row">' +
      '<span class="settings-lab">Unit</span>' +
      '<div class="plan-row" id="unitChips">' +
      '<button type="button" class="filter-chip' + (unit === "m2" ? " on" : "") + '" data-unit="m2">m\u00b2</button>' +
      '<button type="button" class="filter-chip' + (unit === "ft2" ? " on" : "") + '" data-unit="ft2">ft\u00b2</button>' +
      "</div></div>" +
      '<p class="caption">Light is the free PVR map. Pro unlocks every town on file.</p>' +
      "</div>";
    bindSettingsChips();
    document.getElementById("closeSettings").onclick = closePro;
    modal.onclick = function (e) { if (e.target === modal) closePro(); };
  }

  function closePro() {
    const modal = document.getElementById("modal");
    modal.hidden = true;
    modal.innerHTML = "";
    state.proId = null;
  }

  function showToast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { el.hidden = true; }, 2200);
  }

  function openView(view, id) {
    closeDefine();
    if (view === "detail") state.selected = id;
    if (view === "map") state.selected = null;
    state.view = view;
    const sheet = document.getElementById("sheet");
    if (view === "map" && !isDesktop()) {
      sheet.classList.remove("open", "compare-mode");
      resetSheetSnap();
      paintDock();
      refreshMarkers();
      return;
    }
    resetSheetSnap();

  function paintDock() {
    const dock = document.getElementById("dock");
    const chips = state.compare.map(function (id, i) {
      const t = town(id);
      return '<div class="dock-chip slot-' + i + '"><span>' + esc(shortName(t)) + '</span><button type="button" data-rm="' + esc(id) + '" aria-label="Remove">\u00d7</button></div>';
    }).join("");
    const empties = state.compare.length ? "" : '<div class="dock-empty">Tap towns · up to 4</div>';
    dock.innerHTML =
      '<div class="dock-chips" id="dockChips">' + chips + empties + "</div>" +
      '<div class="dock-actions">' +
      '<button type="button" class="clear-compare" id="clearCmp"' + (state.compare.length ? "" : " hidden") + ">Clear</button>" +
      '<button type="button" class="go-compare" id="goCmp"' + (state.compare.length >= 2 ? "" : " disabled") + ">Compare</button>" +
      "</div>";

      b.onclick = function (e) {
        e.stopPropagation();
        removeFromCompare(b.getAttribute("data-rm"));
      };
    });
    document.getElementById("goCmp").onclick = function () {
      if (state.compare.length >= 2) openView("compare");

      state.compare = [];
      paintDock();

  function measureDock() {
    const dock = document.getElementById("dock");
    const app = document.getElementById("app");
    if (!dock || !app) return;
    const h = Math.ceil(dock.getBoundingClientRect().height);
    app.style.setProperty("--dock-h", (h > 0 ? h : 88) + "px");
  }

  function getRailMode() {
    try {
      return localStorage.getItem(RAIL_KEY) === "full" ? "full" : "split";
    } catch (e) {
      return "split";
    }
  }

  function setRailMode(mode) {
    try { localStorage.setItem(RAIL_KEY, mode === "full" ? "full" : "split"); } catch (e) {}
    applyRailMode();
  }

  function applyRailMode() {
    const app = document.getElementById("app");
    const btn = document.getElementById("toggleContentFull");
    const full = isDesktop() && getRailMode() === "full";
    if (app) app.classList.toggle("content-full", full);
    if (btn) {
      btn.setAttribute("aria-pressed", full ? "true" : "false");
      btn.setAttribute("aria-label", full ? "Show map" : "Maximize content");

    if (document.getElementById("priceChart")) renderPriceChart();

  function onResize() {
    measureDock();

    else if (document.getElementById("sheet") && document.getElementById("sheet").classList.contains("open")) {
      applySheetSnap(sheetSnap);

  function ranked() {
    let list = filterTowns(allPlaces()).filter(isRankedTown);
    if (state.listSort === "drive") {
      list = list.slice().sort(function (a, b) { return driveKey(a) - driveKey(b); });
    } else if (state.listSort === "price") {
      list = list.slice().sort(function (a, b) {
        const ha = headlineOf(a), hb = headlineOf(b);
        if (ha == null && hb == null) return 0;
        if (ha == null) return 1;
        if (hb == null) return -1;
        return hb - ha;
      });
    } else {
      list = list.slice().sort(function (a, b) {
        const ra = fileRankOf(a), rb = fileRankOf(b);
        if (ra != null && rb != null && ra !== rb) return ra - rb;
        if (ra != null && rb == null) return -1;
        if (ra == null && rb != null) return 1;
        const sa = scoreOf(a), sb = scoreOf(b);
        if (sa == null && sb == null) return 0;
        if (sa == null) return 1;
        if (sb == null) return -1;
        return sb - sa;
      });
    }
    return list.map(function (t) { return Object.assign({}, t, { _rank: fileRankOf(t) }); });
  }

  function filterTowns(list) {
    if (state.listFilter === "all") return list;
    if (state.listFilter === "coming") {
      return list.filter(function (t) {
        return itemsForTown(t.id).some(isComingItem);
      });
    }
    return list.filter(function (t) { return tierOf(t) === state.listFilter; });
  }

    if (back) back.onclick = function () { openView("list"); };

      addToCompare(state.selected);
      paintSheet();

        else addToCompare(id);

    });
    body.querySelectorAll("[data-metric]").forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        const key = b.getAttribute("data-metric");
        openDefine(key, town(state.compare[0]) || town(state.selected));
      };
    });
    body.querySelectorAll("[data-cfil]").forEach(function (b) {
      b.onclick = function () {
        state.comingFilter = b.getAttribute("data-cfil");
        paintSheet();
      };
    });
    bindPriceControls();
    requestAnimationFrame(function () {
      if (document.getElementById("radar")) renderChart(chartTownIds());
      if (document.getElementById("priceChart")) renderPriceChart();
    });
  }

  loadData().then(function (pack) { boot(pack[0], pack[1], pack[2], pack[3], pack[4], pack[5]); }).catch(function (err) {
    const el = document.getElementById("sheetBody");
    if (el) el.innerHTML = "<p class=\"caption\">Could not load pvr-towns-aug2026.json / scores-spider-aug2026.json. Serve this folder over http.</p>";
    document.getElementById("sheet").classList.add("open");
    console.error(err);
  });
})();

</script>
</body>
</html>
